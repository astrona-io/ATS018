# Course manifest for ATS018 - GitOps and Continuous Delivery (Certified Cloud Native Platform Engineer).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. Playgrounds are not
# listed: the landing page's playground marker shows them. solution.md is
# never listed.
#
# Every `path:` is relative to this file.

training:
  id: ATS018
  title: "CNPE: GitOps and Continuous Delivery"
  description: >
    Training material covering the Certified Cloud Native Platform Engineer
    (CNPE) GitOps and Continuous Delivery domain: packaging applications with
    Kustomize and Helm, continuous delivery from Git with Argo CD and Flux,
    continuous integration pipelines with Tekton that hand a new image to a
    GitOps repository, and progressive delivery with Argo Rollouts and
    Flagger. Each module pairs a layered reader with an ungraded hands-on
    playground on a local kind cluster. Delivery modules supply an in-cluster
    Gitea server when needed.
    Built for Kubernetes 1.35.

  certification:
    name: Certified Cloud Native Platform Engineer
    code: CNPE
    provider: CNCF / Linux Foundation
    domain: GitOps and Continuous Delivery
    weight: 25
    competencies:
      - "Implementing GitOps Workflows for Application and Infrastructure Deployment"
      - "Building and Configuring CI/CD Pipelines Integrated with Kubernetes"
      - "Deploying Applications Using Progressive Delivery Strategies (for example Blue/Green or Canary)"

modules:

  - id: module-intro
    title: "Introduction"
    description: >
      Start here. What this course trains you to do, how it is laid out, how
      to get your machine ready with the astrona command-line tool, how the
      content is written and checked, who maintains it, and how to report a
      mistake.

    content:
      - type: reading
        title: Introduction
        path: sections/intro/README.md
      - type: reading
        title: "Welcome To The Course"
        path: sections/intro/course-01-welcome.md
      - type: reading
        title: "Get Your Machine Ready"
        path: sections/intro/course-02-get-your-machine-ready.md
      - type: reading
        title: "How This Course Is Made"
        path: sections/intro/course-03-how-this-course-is-made.md

  - id: module-010
    title: "Build Manifests With Kustomize"
    description: >
      Every GitOps controller applies manifests that a packaging tool
      renders from Git. Kustomize builds them from a shared base and one
      overlay per environment. Build overlays and patches, generate
      configuration, render the result before it is applied and fix
      Kustomize build errors.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Build Environment Overlays With Kustomize"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "One Base, Rendered Before It Is Applied"
        path: sections/section-010/module-01/course-01-base-and-kustomization.md
      - type: reading
        title: "Overlays And Patches"
        path: sections/section-010/module-01/course-02-overlays-and-patches.md
      - type: reading
        title: "Generators, Diff And Apply"
