      section teaches the reader to deliver an application from a Git
      repository, scale that to many applications and tenants with
      ApplicationSets and AppProjects, and diagnose the sync and health
      failures that the exam expects a platform engineer to fix. It
      comes after packaging because every Argo CD Application renders a
      Kustomize overlay or a Helm chart.

