  - id: module-050
    title: "Continuous Integration Pipelines With Tekton"
    description: >
      A GitOps controller only delivers what lands in Git. This section
      teaches Tekton, a CI system that runs each step as a container in
      a pod, and ends with the hand-off where a pipeline pushes a new
      image tag and commits it to the GitOps repository that Argo CD
      watches. It comes after the delivery sections because the hand-off
      needs an Application to deliver the result.

