      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-02/question.md
      - type: lab
        title: "Build A Kustomize Overlay With A Generated ConfigMap Lab"
        path: sections/section-010/module-01/labs/lab-02
        difficulty: beginner
        estimated_duration: 20m
        topic: packaging
        task_kind: build
        tags: [kustomize, overlays, patches, config-generator]
        learning_goals:
          - Complete a staging overlay that sets the namespace, image tag and replica count of an unchanged base
          - Generate a ConfigMap with a hash suffix and load it into the container with a patch
          - Prove the overlay matches the cluster with kubectl diff -k and answers from shuttle with the new version and message
        resources:
          - name: "Kustomize in kubectl"
            url: https://kubernetes.io/docs/tasks/manage-kubernetes-objects/kustomization/
          - name: "Kustomize reference"
            url: https://kubectl.docs.kubernetes.io/references/kustomize/
      - type: reading
