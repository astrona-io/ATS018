# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-010-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
bootstrap:
  init:
    - name: helm-cli
      description: Installs Helm 4.3.0 in the terminal
      type: file
      source: bootstrap/00-install-helm.sh
    - name: lab-start
      description: Creates namespaces and the shuttle client
      type: file
      source: bootstrap/01-seed-cluster.sh
teardown:
  keepCluster: false
