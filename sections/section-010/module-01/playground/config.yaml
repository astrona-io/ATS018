# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Build Environment Overlays With Kustomize (PLAYGROUND) — playground environment.
# A clean sandbox: it starts, applies the starting namespaces and the client
# pod, then stays running for free exploration. No task, no grading, no
# `astrona submit`.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-010-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0

# What the learner starts with: three empty application namespaces and the
# `shuttle` client. No `scout` workload, no GitOps controller, no Helm release:
# the learner builds the manifests with Kustomize.
bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
