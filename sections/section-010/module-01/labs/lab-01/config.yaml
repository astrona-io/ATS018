# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-010-01
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0

bootstrap:
  init:
    - name: lab-start
      description: Creates the three namespaces and the shuttle client pod
      type: file
      source: bootstrap/01-seed-cluster.sh

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: staging-environment
      description: Staging runs scout 6.15.0 with one replica, the generated ConfigMap and the message staging
      type: file
      source: validation/validate-staging.sh
    - name: production-environment
      description: Production runs scout 6.14.0 with three replicas, the memory limit and the production label
      type: file
      source: validation/validate-production.sh

teardown:
  keepCluster: false
