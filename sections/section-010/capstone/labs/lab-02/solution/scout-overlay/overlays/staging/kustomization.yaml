apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: starfleet-staging
resources:
  - ../../base
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.15.0
replicas:
  - name: scout
    count: 1
configMapGenerator:
  - name: scout-settings
    literals:
      - PODINFO_UI_MESSAGE=overlay-staging
patches:
  - path: deployment-env.yaml
