apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: starfleet-staging
resources:
  - ../../base
labels:
  - pairs:
      environment: staging
images:
  - name: podinfo
    newTag: 6.15.0
configMapGenerator:
  - name: scout-settings
    literals:
      - PODINFO_UI_MESSAGE=staging
patches:
  - path: deployment-env.yaml
