apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: starfleet-production
resources:
  - ../../base
labels:
  - pairs:
      environment: production
replicas:
  - name: scouts
    count: 3
configMapGenerator:
  - name: scout-config
    literals:
      - PODINFO_UI_MESSAGE=production
patches:
  - path: deployment-env.yaml
