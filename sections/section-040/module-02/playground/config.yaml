# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Hand Off From A Tekton Pipeline To GitOps (PLAYGROUND) — playground environment.
# Tekton Pipelines 1.17.0 and Triggers 0.36.4, an in-cluster OCI registry,
# Gitea (plumbing only) with the private repositories starfleet/scout-app and
# starfleet/scout-deploy, and Argo CD 3.5.4 with the Application `scout` that
# auto-syncs scout-deploy into `starfleet`. Deliberately absent: no Gitea
# webhook, no EventListener and no Git credential Secret for the pipeline.
# No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-040-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - alpine/git:2.52.0
      - gcr.io/go-containerregistry/crane:v0.22.1
      - gcr.io/go-containerregistry/crane/debug:v0.22.1
      - registry:3.1.2
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-registry
      description: "Starts the in-cluster registry and copies scout 6.14.0 into it"
      type: file
      source: bootstrap/02-install-registry.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/03-install-argocd.sh
    - name: install-tekton
      description: "Installs Tekton Pipelines 1.17.0 and Triggers 0.36.4"
      type: file
      source: bootstrap/04-install-tekton.sh
    - name: seed
      description: "Pushes scout-app and scout-deploy into Git and creates the Argo CD Application"
      type: file
      source: bootstrap/05-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/scout
      namespace: starfleet

teardown:
  keepCluster: false
