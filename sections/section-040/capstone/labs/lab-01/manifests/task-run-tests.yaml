apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
  namespace: starfleet
spec:
  workspaces:
    - name: source
  results:
    - name: version
      description: The tested application version
  steps:
    - name: test
      image: alpine:3.23
      workingDir: /workspace/wrong
      script: |
        #!/bin/sh
        set -eu
        sh test.sh
        printf '%s' "$(cat VERSION)" > "$(results.version.path)"
