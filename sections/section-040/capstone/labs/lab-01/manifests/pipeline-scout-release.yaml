apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: scout-release
  namespace: starfleet
spec:
  params:
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  tasks:
    - name: fetch-source
      taskRef:
        name: fetch-source
      params:
        - name: url
          value: http://gitea-http.gitea.svc:3000/starfleet/scout-app.git
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: source
    - name: run-tests
      runAfter:
        - fetch-source
      taskRef:
        name: run-tests
      workspaces:
        - name: source
          workspace: source
    - name: publish-image
      runAfter:
        - fetch-source
      taskRef:
        name: publish-image
    - name: update-deploy
      runAfter:
        - publish-image
      taskRef:
        name: update-deploy
      params:
        - name: version
          value: $(tasks.fetch-source.results.version)
  results:
    - name: deploy-commit
      value: $(tasks.update-deploy.results.commit)
