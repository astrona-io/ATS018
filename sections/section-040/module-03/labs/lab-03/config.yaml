# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-040-03-03
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - quay.io/argoproj/workflow-controller:v4.1.6
      - quay.io/argoproj/argoexec:v4.1.6

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-argo-cli
      description: Installs the argo command-line tool v4.1.6 in ~/.astrona/bin unless argo is already on the PATH
      type: file
      source: bootstrap/00-install-argo-cli.sh
    - name: install-argo-workflows
      description: Installs Argo Workflows v4.1.6 into starfleet
      type: file
      source: bootstrap/01-install-argo-workflows.sh
    - name: seed
      description: Installs the WorkflowTemplate shuttle-release with three steps and leaves one Succeeded run of it
      type: file
      source: bootstrap/02-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: step-inserted
      description: The steps list of main runs fetch-manifest, verify-checksum, deploy and notify in four groups, and verify-checksum gets the manifest from fetch-manifest
      type: file
      source: validation/validate-step-inserted.sh
    - name: workflow-succeeded
      description: A Succeeded run of shuttle-release ran verify-checksum after fetch-manifest and before deploy
      type: file
      source: validation/validate-workflow-succeeded.sh
    - name: checksum-output
      description: The checksum that verify-checksum produced is the SHA-256 of the manifest that fetch-manifest produced
      type: file
      source: validation/validate-checksum-output.sh
    - name: one-run
      description: Exactly one Workflow of shuttle-release remains, and it Succeeded
      type: file
      source: validation/validate-one-run.sh

teardown:
  keepCluster: false
