# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-040-03-02
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - quay.io/argoproj/workflow-controller:v4.1.6
      - quay.io/argoproj/argoexec:v4.1.6

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-argo-cli
      description: Installs the argo command-line tool v4.1.6 in ~/.astrona/bin unless argo is already on the PATH
      type: file
      source: bootstrap/00-install-argo-cli.sh
    - name: install-argo-workflows
      description: Installs Argo Workflows v4.1.6 into starfleet
      type: file
      source: bootstrap/01-install-argo-workflows.sh
    - name: seed
      description: Installs the WorkflowTemplates scout-check and outpost-config and leaves one failed run
      type: file
      source: bootstrap/02-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: template-fixed
      description: The check-version template of scout-check reads the file its ConfigMap provides and still compares the version
      type: file
      source: validation/validate-template-fixed.sh
    - name: parallel-steps
      description: scout-check runs prepare first, then check-version and check-version-copy in one step group
      type: file
      source: validation/validate-parallel-steps.sh
    - name: scout-check-run
      description: A Succeeded run of scout-check ran both copies of the step in one group
      type: file
      source: validation/validate-scout-check-run.sh
    - name: outpost-run
      description: A Succeeded run of outpost-config targeted outpost with outpost-provisioner and created the objects
      type: file
      source: validation/validate-outpost-run.sh
    - name: one-success-each
      description: Only one Workflow remains for each WorkflowTemplate, and each one Succeeded
      type: file
      source: validation/validate-one-success-each.sh

teardown:
  keepCluster: false
