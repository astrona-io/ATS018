# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-040-03-04
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - curlimages/curl:8.22.0
    - alpine:3.23
    - quay.io/argoproj/workflow-controller:v4.1.6
    - quay.io/argoproj/argoexec:v4.1.6
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - ghcr.io/stefanprodan/podinfo:6.14.0
bootstrap:
  manifests:
  - name: lab-start
    type: file
    source: manifests/lab-start.yaml
  init:
  - name: install-argo-cli
    description: Installs the argo command-line tool v4.1.6 in ~/.astrona/bin unless argo is already on the PATH
    type: file
    source: bootstrap/00-install-argo-cli.sh
  - name: install-argo-workflows
    description: Installs Argo Workflows v4.1.6 into starfleet
    type: file
    source: bootstrap/01-install-argo-workflows.sh
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
testing:
  init:
  - name: verify-unfinished-state
    description: Require an explicit rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    description: Apply the reference solution and wait for the live result
    type: file
    source: solution/apply.sh
    timeout: 15m
validation:
  scripts:
  - name: live-result
    description: Pass image, name, namespace and task into a resource template; Submit two successful runs and verify
      their ready Deployments
    type: file
    source: validation/validate.sh
teardown:
  keepCluster: false
