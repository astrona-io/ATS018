# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Run CI Workflows With Argo Workflows (PLAYGROUND) — playground environment.
# Argo Workflows v4.1.6 (namespaced install in `starfleet`, Argo server off),
# Argo Events v1.9.11 with a one-pod JetStream EventBus, and a public Git
# repository `starfleet/scout-app` (in-cluster Gitea, plumbing only) that has a
# push webhook. The `run-tests` WorkflowTemplate fails on purpose because of a
# wrong working directory. No EventSource, no Sensor. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-040-03
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - alpine/git:2.52.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/workflow-controller:v4.1.6
      - quay.io/argoproj/argoexec:v4.1.6
      - quay.io/argoproj/argo-events:v1.9.11
      - nats:2.10.29
      - natsio/prometheus-nats-exporter:0.14.0
      - natsio/nats-server-config-reloader:0.14.0
  portForwards:
    - name: git
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http
bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argo-workflows
      description: "Installs Argo Workflows v4.1.6 into starfleet"
      type: file
      source: bootstrap/02-install-argo-workflows.sh
    - name: install-argo-events
      description: "Installs Argo Events v1.9.11 and a one-pod EventBus"
      type: file
      source: bootstrap/03-install-argo-events.sh
    - name: seed
      description: "Pushes scout-app into Git, adds the push webhook and installs the run-tests WorkflowTemplate"
      type: file
      source: bootstrap/04-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
teardown:
  keepCluster: false
