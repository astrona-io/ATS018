apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployment-writer
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-writer
  namespace: starfleet
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
- apiGroups:
  - argoproj.io
  resources:
  - workflowtaskresults
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-writer
  namespace: starfleet
subjects:
- kind: ServiceAccount
  name: deployment-writer
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-writer
  namespace: outpost
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-writer
  namespace: outpost
subjects:
- kind: ServiceAccount
  name: deployment-writer
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-writer
