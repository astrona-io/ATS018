# Knowledge check for section 040, module 03. Listed in astrona.yaml as a
# `type: quiz` entry right after the module summary. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats018-040-03
course_id: ATS018
exam_code: CNPE
status: alpha
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: module
  id: section-040/module-03
  title: "Run CI Workflows With Argo Workflows"
questions:
  - id: ats018-040-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the containers of a Workflow task pod."
    source_readings:
      - sections/section-040/module-03/course-01-a-workflow-with-a-dag.md
    prompt: "A task of an Argo Workflow finished. `kubectl get pods` shows its pod as `0/2` ready with the status `Completed`. What are the two containers?"
    options:
      - id: a
        text: "`main`, which runs your image, and `wait`, the Argo executor that collects the outputs"
        explanation: "Correct. Both have ended, so the pod shows `0/2` ready."
      - id: b
        text: "`init` and `main`, because every pod has an init container"
        explanation: "An `init` container only appears for git input artifacts, and it is not counted in the ready column."
      - id: c
        text: "`step-main` and `step-wait`, named after the steps"
        explanation: "Those names belong to Tekton, not to Argo Workflows."
      - id: d
        text: "`argo-server` and `main`"
        explanation: "The Argo server is not part of a task pod."
    correct_option: a
    explanation: "The `main` container holds the output of your command. The `wait` container holds the executor log lines. `0/2` is normal for a finished task."

  - id: ats018-040-03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read how a DAG orders tasks."
    source_readings:
      - sections/section-040/module-03/course-01-a-workflow-with-a-dag.md
    prompt: "In a DAG template, `read-version` and `test` both have `depends: clone`. When do they start?"
    options:
      - id: a
        text: "One after the other, in the order of the list"
        explanation: "The list order does not decide the start."
      - id: b
        text: "At the same time, as soon as `clone` is done"
        explanation: "Correct. Tasks without a dependency between them run at the same time."
      - id: c
        text: "Before `clone`, because a DAG template starts all tasks together"
        explanation: "A task starts when its dependencies are done."
      - id: d
        text: "Never, because a DAG template does not run anything"
        explanation: "The DAG template itself runs nothing, but its tasks run as pods."
    correct_option: b
    explanation: "The controller starts a task as soon as its dependencies are done. The ages of the pods show `read-version` and `test` starting together."

  - id: ats018-040-03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pass an output parameter between tasks."
    source_readings:
      - sections/section-040/module-03/course-01-a-workflow-with-a-dag.md
    prompt: "Task `read-version` writes the version to the file `/tmp/version` and declares it as an output parameter `version`. How does task `report` receive it?"
    options:
      - id: a
        text: "As an argument with the value `{{tasks.read-version.outputs.parameters.version}}`"
        explanation: "Correct. The `wait` container reads the file and reports the value to the controller."
      - id: b
        text: "With `{{workflow.parameters.version}}`, which reads any output"
        explanation: "That reads a Workflow parameter, not the output of a task."
      - id: c
        text: "With `$(tasks.read-version.results.version)`, which is the Argo Workflows syntax"
        explanation: "That is the Tekton syntax."
      - id: d
        text: "It cannot, because tasks only share data through a volume"
        explanation: "A volume carries files. Parameters pass small values."
    correct_option: a
    explanation: "The Workflow shows three ways to move data: a Workflow parameter, an output parameter of a task, and a volume from `volumeClaimTemplates`."

  - id: ats018-040-03-q04
    type: single_choice
    difficulty: beginner
    learning_objective: "Start a run from a WorkflowTemplate."
    source_readings:
      - sections/section-040/module-03/course-02-reuse-a-workflow-with-a-workflowtemplate.md
    prompt: "A `WorkflowTemplate` named `scout-ci` holds a DAG. Which field of a new Workflow starts a run from it?"
    options:
      - id: a
        text: "`spec.templates[0].name: scout-ci`"
        explanation: "That defines a template inside the Workflow instead of referring to the object."
      - id: b
        text: "`spec.serviceAccountName: scout-ci`"
        explanation: "That selects a ServiceAccount."
      - id: c
        text: "`spec.workflowTemplateRef.name: scout-ci`"
        explanation: "Correct. The Workflow holds the name and the arguments, and the controller reads the rest from the template."
      - id: d
        text: "`metadata.generateName: scout-ci-`"
        explanation: "That only sets the name prefix of the Workflow."
    correct_option: c
    explanation: "A `WorkflowTemplate` never runs by itself. A Workflow names it, and its `arguments` replace the default arguments of the template."

  - id: ats018-040-03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell Error from Failed for a missing template."
    source_readings:
      - sections/section-040/module-03/course-02-reuse-a-workflow-with-a-workflowtemplate.md
    prompt: "A Workflow refers to the template `scout-ci` that does not exist. `kubectl get workflows` shows the phase `Error` and the message `workflowtemplates.argoproj.io \"scout-ci\" not found`. What does the phase mean?"
    options:
      - id: a
        text: "The controller could not start the run, and no pod exists"
        explanation: "Correct. `Error` means the run could not work as it should."
      - id: b
        text: "A container ended with a non-zero exit code"
        explanation: "That gives `Failed`."
      - id: c
        text: "A task depended on a failed task"
        explanation: "That task is `Omitted`."
      - id: d
        text: "The tests inside the pod failed"
        explanation: "No pod ran, so no test ran."
    correct_option: a
    explanation: "`Failed` means a node ran and ended with a failure. `Error` means the controller could not run the Workflow, for example a missing template. After you create the template, start a new Workflow."

  - id: ats018-040-03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a failed DAG Workflow."
    source_readings:
      - sections/section-040/module-03/course-03-read-a-failed-workflow.md
    prompt: "A DAG Workflow has the phase `Failed`. The nodes show `clone` as `Failed` and `read-version`, `test` and `report` as `Omitted`. Where is the cause?"
    options:
      - id: a
        text: "In the log of the `report` pod, because it is the last task"
        explanation: "`Omitted` tasks did not run, so they have no log."
      - id: b
        text: "In all four nodes, because each one has its own error"
        explanation: "Three of the nodes are only a result of the failure."
      - id: c
        text: "In the `WorkflowTemplate`, which you must edit and wait for"
        explanation: "Read the failed node first. The template may be fine."
      - id: d
        text: "In the log of the `main` container of the `clone` pod"
        explanation: "Correct. Only the node with the phase `Failed` or `Error` holds the cause."
    correct_option: d
    explanation: "Read the phase of the Workflow, then the nodes in `status.nodes`, then the log of the pod of the failed node. In the example, `git` said that the remote branch `nope` was not found."

  - id: ats018-040-03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the logs of all pods of a Workflow."
    source_readings:
      - sections/section-040/module-03/course-03-read-a-failed-workflow.md
    prompt: "A DAG Workflow has several pods. Which command reads the `main` logs of all of them, with the pod name in front of each line?"
    options:
      - id: a
        text: "`kubectl -n starfleet logs <workflow name> -c main`"
        explanation: "This only works when the Workflow has a single pod."
      - id: b
        text: "`kubectl -n starfleet logs -l workflows.argoproj.io/workflow=<workflow name> -c main --prefix`"
        explanation: "Correct. The label is on every pod of the Workflow."
      - id: c
        text: "`kubectl -n starfleet describe workflow <workflow name> -c main`"
        explanation: "`describe` shows the object. It does not read container logs."
      - id: d
        text: "`kubectl -n argo-events logs -l sensor-name=push-ci`"
        explanation: "That reads the log of a Sensor, not of a Workflow."
    correct_option: b
    explanation: "Use the label `workflows.argoproj.io/workflow=<name>` to select the pods. Filter out the `level=INFO` lines to read only your own output."

  - id: ats018-040-03-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the phases of an Argo Workflow."
    source_readings:
      - sections/section-040/module-03/course-03-read-a-failed-workflow.md
    prompt: "A Workflow ends in `Error`, and the command in its `main` container works when you run it by hand. The message names `workflowtaskresults` and the `default` ServiceAccount. What is the cause?"
    options:
      - id: a
        text: "A container exited with a non-zero code"
        explanation: "That gives `Failed`, not `Error`."
      - id: b
        text: "The EventBus has too many replicas"
        explanation: "The EventBus does not affect a running Workflow."
      - id: c
        text: "The ServiceAccount may not create `workflowtaskresults`, so the executor cannot report the result"
        explanation: "Correct. The executor in the `wait` container needs that right."
      - id: d
        text: "A task depended on a failed task"
        explanation: "That task is `Omitted`."
    correct_option: c
    explanation: "`Failed` means a container exited with a non-zero code. `Error` means the controller or the executor could not do its work. Set `spec.serviceAccountName: workflow-runner`, which has a Role with that permission."

  - id: ats018-040-03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the objects of Argo Events."
    source_readings:
      - sections/section-040/module-03/course-04-start-a-workflow-from-a-git-push.md
    prompt: "A Git push must create a Workflow. Which object receives the webhook, which carries the event inside the cluster, and which filters it and creates the Workflow?"
    options:
      - id: a
        text: "`Sensor`, `EventBus`, `EventSource`"
        explanation: "The `Sensor` is the last one, not the first."
      - id: b
        text: "`EventBus`, `Sensor`, `EventSource`"
        explanation: "The `EventBus` does not receive webhooks."
      - id: c
        text: "`EventSource`, `Sensor`, `EventBus`"
        explanation: "The `Sensor` filters and triggers. The `EventBus` carries events."
      - id: d
        text: "`EventSource`, `EventBus`, `Sensor`"
        explanation: "Correct. A `webhook` event source receives the push, the bus carries it, and the `Sensor` filters it with a data filter on `body.ref` and runs the trigger."
    correct_option: d
    explanation: "Argo Workflows cannot listen for a push. Argo Events does it, and a push to another branch reaches the event source but the Sensor drops it."

  - id: ats018-040-03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Find why a Sensor creates no Workflow."
    source_readings:
      - sections/section-040/module-03/course-04-start-a-workflow-from-a-git-push.md
    prompt: "A push to `main` reaches the `EventSource`, but no Workflow appears. The Sensor uses the ServiceAccount `workflow-submitter`. Where do you look first?"
    options:
      - id: a
        text: "In the Sensor pod log, with `kubectl -n argo-events logs -l sensor-name=push-ci`"
        explanation: "Correct. A missing Role shows only there, for example a `forbidden` error on `workflowtemplates`."
      - id: b
        text: "In `kubectl -n starfleet get workflows`, which lists the error"
        explanation: "No Workflow exists, so that list has no error to show."
      - id: c
        text: "In the log of the Gitea pod, because it creates the Workflow"
        explanation: "Gitea only sends the webhook."
      - id: d
        text: "In the Argo CD `Application`, because it creates Workflows"
        explanation: "Argo CD plays no part in this path."
    correct_option: a
    explanation: "The `submit` operation needs the right to create Workflows and to read `workflowtemplates`. Without the Role, the Sensor creates nothing, and the error is only in the Sensor pod log."
