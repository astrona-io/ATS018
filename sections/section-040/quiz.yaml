kind: question_bank
id: ats018-section-040-quiz
course_id: ATS018
exam_code: CNPE
status: draft
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: section
  id: section-040
  title: "Continuous Integration Pipelines (Tekton, Argo Workflows and Events)"
questions:
  - id: ats018-040-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the containers of a TaskRun pod."
    source_readings:
      - sections/section-040/module-01/course-01-tasks-taskruns-and-pods.md
    prompt: "A Task has two steps, `fetch` and `test`. How does Tekton run one TaskRun of it?"
    options:
      - id: a
        text: "One pod with one container per step, named `step-fetch` and `step-test`, run one after the other"
        explanation: "Correct. The entrypoint program makes the steps run in order."
      - id: b
        text: "Two pods, one for each step"
        explanation: "One TaskRun creates one pod."
      - id: c
        text: "One container that runs both steps as shell commands"
        explanation: "Each step is its own container."
      - id: d
        text: "No pod, because the Tekton controller runs the steps itself"
        explanation: "The steps run as containers in a pod."
    correct_option: a
    explanation: "A Task is a list of steps and each step is a container. A TaskRun creates one pod with containers named `step-<step name>`."
  - id: ats018-040-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Share files between Tasks of a Pipeline."
    source_readings:
      - sections/section-040/module-01/course-02-workspaces-and-pipelines.md
    prompt: "Task `fetch-source` writes files and Task `run-tests` must read them. How can the files pass between the two Tasks?"
    options:
      - id: a
        text: "Through the same pod, because a Pipeline uses one pod"
        explanation: "Each Task in a Pipeline runs in its own pod."
      - id: b
        text: "Through a workspace backed by a PersistentVolumeClaim"
        explanation: "Correct. Each Task in a Pipeline runs in its own pod, so a shared volume is the way."
      - id: c
        text: "Through `$(results.<name>.path)`, which holds any size of file"
        explanation: "Results are small named outputs, not file storage."
      - id: d
        text: "Through `runAfter`, which copies the files"
        explanation: "`runAfter` only orders the Tasks."
    correct_option: b
    explanation: "Each Task runs in its own pod, so an `emptyDir` workspace is empty for the second Task. A PersistentVolumeClaim workspace carries the files. A `volumeClaimTemplate` creates a fresh claim for each run."
  - id: ats018-040-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a failed run from the top down."
    source_readings:
      - sections/section-040/module-01/course-03-reading-a-failed-taskrun.md
    prompt: "A PipelineRun failed. In which order do you read the status to find the error itself?"
    options:
      - id: a
        text: "The container log first, then the PipelineRun message"
        explanation: "Start from the top so you know which step to open."
      - id: b
        text: "The EventListener log, then the Task definition"
        explanation: "The EventListener only starts runs."
      - id: c
        text: "The PipelineRun message, then the failed TaskRun with its step and exit code, then the container log of that step"
        explanation: "Correct. The log of the failing step holds the error."
      - id: d
        text: "The registry, then the TaskRun"
        explanation: "The registry does not hold the run status."
    correct_option: c
    explanation: "Read from the top down: PipelineRun message, failed TaskRun and step, container log."
  - id: ats018-040-q04
    type: single_choice
    difficulty: advanced
    learning_objective: "Tell a broken definition from a failing step."
    source_readings:
      - sections/section-040/module-01/course-03-reading-a-failed-taskrun.md
    prompt: "A PipelineRun fails with the reason `InvalidWorkspaceBindings` and no pod exists. What does that tell you?"
    options:
      - id: a
        text: "A step exited with a non-zero code"
        explanation: "That gives a `StepFailed` reason on a TaskRun, and a pod exists."
      - id: b
        text: "The registry refused an image"
        explanation: "That needs a pod that tries to pull the image."
      - id: c
        text: "The resolver is turned off"
        explanation: "A resolver problem shows as `CouldntGetTask`."
      - id: d
        text: "The definition is broken, so the run failed before any pod was created"
        explanation: "Correct. A missing workspace binding fails on the PipelineRun itself."
    correct_option: d
    explanation: "Reasons such as `InvalidWorkspaceBindings` and `CouldntGetTask` mean a broken definition, and no pod is created. A finished run never changes: fix the definition and start a new run."
  - id: ats018-040-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Give a pipeline step Git credentials."
    source_readings:
      - sections/section-040/module-02/course-02-commit-the-new-tag-with-git-credentials.md
    prompt: "A Task must push a commit to a private Gitea repository. How does Tekton give the step its credentials?"
    options:
      - id: a
        text: "A Secret of type `kubernetes.io/basic-auth` with the annotation `tekton.dev/git-0`, listed in the ServiceAccount of the run"
        explanation: "Correct. Tekton writes `.gitconfig` and `.git-credentials` into the home folder of each step."
      - id: b
        text: "A ConfigMap that holds the password, mounted by hand in every step"
        explanation: "Tekton builds the Git files from an annotated Secret."
      - id: c
        text: "A ClusterRole for the ServiceAccount on the Gitea Service"
        explanation: "Kubernetes rights do not give Git access."
      - id: d
        text: "The `EventListener`, which forwards its own token"
        explanation: "The EventListener only starts runs."
    correct_option: a
    explanation: "The annotated Secret in the run's ServiceAccount is the way. The ServiceAccount needs no rights on workloads."
  - id: ats018-040-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say who applies the release in a CI to GitOps hand-off."
    source_readings:
      - sections/section-040/module-02/course-03-one-pipeline-from-source-to-commit.md
    prompt: "A Pipeline publishes a new image tag and commits it to the GitOps repository. Which component applies the new tag to the cluster?"
    options:
      - id: a
        text: "The Tekton Pipeline, with `kubectl apply`"
        explanation: "The pipeline never applies to the cluster."
      - id: b
        text: "Argo CD"
        explanation: "Correct. The pipeline writes to the registry and to Git, and only Argo CD writes to the cluster."
      - id: c
        text: "The `EventListener`"
        explanation: "It receives the webhook and creates the run."
      - id: d
        text: "The registry"
        explanation: "A registry stores images and applies nothing."
    correct_option: b
    explanation: "The pipeline never applies to the cluster. It commits to Git, and Argo CD syncs."
  - id: ats018-040-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the parts of Tekton Triggers."
    source_readings:
      - sections/section-040/module-02/course-04-start-the-pipeline-from-a-git-push.md
    prompt: "In Tekton Triggers, which object reads values such as `$(body.after)` from the webhook request?"
    options:
      - id: a
        text: "The `TriggerTemplate`"
        explanation: "It creates the PipelineRun from the values."
      - id: b
        text: "The `EventListener`"
        explanation: "It receives the webhook and runs the interceptors."
      - id: c
        text: "The `TriggerBinding`"
        explanation: "Correct. The binding reads values, and the `TriggerTemplate` creates the PipelineRun with them."
      - id: d
        text: "The `cel` interceptor"
        explanation: "It filters events."
    correct_option: c
    explanation: "`EventListener` receives, the `cel` interceptor filters, `TriggerBinding` reads values and `TriggerTemplate` creates the run."
  - id: ats018-040-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the phases of an Argo Workflow."
    source_readings:
      - sections/section-040/module-03/course-03-read-a-failed-workflow.md
    prompt: "A Workflow ends in `Error`, but the command in its main container works when you run it by hand. What is a likely cause?"
    options:
      - id: a
        text: "A container exited with a non-zero code"
        explanation: "That gives `Failed`, not `Error`."
      - id: b
        text: "A task depended on a failed task"
        explanation: "That task is `Omitted`."
      - id: c
        text: "The EventBus has too many replicas"
        explanation: "The EventBus does not affect a running Workflow."
      - id: d
        text: "The ServiceAccount may not create `workflowtaskresults`, so the executor cannot report the result"
        explanation: "Correct. The executor needs that right, and without it the run ends in `Error`."
    correct_option: d
    explanation: "`Failed` means a container exited with a non-zero code. `Error` means the controller or the executor could not do its work. `Omitted` is a consequence."
  - id: ats018-040-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read how a DAG orders tasks."
    source_readings:
      - sections/section-040/module-03/course-01-a-workflow-with-a-dag.md
    prompt: "In a DAG template, task `deploy` has `depends: test`, and `test` fails. What is the phase of `deploy`?"
    options:
      - id: a
        text: "`Omitted`"
        explanation: "Correct. A task that depends on a failed task is `Omitted`."
      - id: b
        text: "`Succeeded`"
        explanation: "It did not run."
      - id: c
        text: "`Failed`"
        explanation: "The failure belongs to `test`; `deploy` is only a consequence."
      - id: d
        text: "`Running`"
        explanation: "It starts only after the dependency succeeds."
    correct_option: a
    explanation: "Tasks without a dependency between them run at the same time. A task that depends on a failed task is `Omitted`."
