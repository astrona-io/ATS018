# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-040-01
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - alpine/git:2.52.0
      - gitea/gitea:28.1.0-rootless
  portForwards:
    - name: git
      description: The Git server (Gitea)
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: Starts the in-cluster Git server
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-tekton
      description: Installs Tekton Pipelines 1.17.0
      type: file
      source: bootstrap/02-install-tekton.sh
    - name: seed
      description: Pushes scout-app into Git and installs the Tasks and the Pipeline
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: task-fixed
      description: The run-tests Task still runs test.sh and now starts in the workspace
      type: file
      source: validation/validate-task-fixed.sh
    - name: pipeline-run-succeeded
      description: A PipelineRun of scout-ci Succeeded with the fixed Task and reports version 6.15.0
      type: file
      source: validation/validate-pipelinerun.sh

teardown:
  keepCluster: false
