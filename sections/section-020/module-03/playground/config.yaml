# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Diagnose Sync And Health Failures In Argo CD (PLAYGROUND) — playground environment.
# Argo CD 3.5.4, metrics-server, and a private Git repository (in-cluster Gitea,
# plumbing only) with four folders. Four Applications are broken on purpose:
# wrong path, rejected manifest, HPA drift, missing image. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-020-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - busybox:1.37
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes scout-faults into Git and creates the four broken Applications"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
