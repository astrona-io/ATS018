# Knowledge check for section 020, module 03. Contract:
# schemas/question-bank.schema.json. Keep question ids stable once published.
schema_version: 1
kind: question_bank
id: ats018-020-03
course_id: ATS018
exam_code: CNPE
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-020/module-03
  title: Diagnose Sync And Health Failures In Argo CD
questions:
  - id: ats018-020-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Place a failing application at the right stage from its sync status."
    source_readings:
      - sections/section-020/module-03/course-01-where-argo-cd-reports-a-problem.md
    prompt: "An `Application` shows sync status `Unknown` and health `Healthy`. Where do you read the cause first?"
    options:
      - id: a
        text: "In the pod events of the destination namespace, because the pods are failing"
        explanation: "There may be no pods at all. `Unknown` means Argo CD could not build the desired state."
      - id: b
        text: "In the `status.conditions` of the `Application`, where a `ComparisonError` from the repo server appears"
        explanation: "Correct. `Unknown` means Argo CD could not fetch or render the desired state, so it had nothing to compare."
      - id: c
        text: "In the Deployment rollout status, because health is the problem"
        explanation: "`Healthy` means nothing here. With nothing rendered, there are no objects to judge."
      - id: d
        text: "In the Redis logs, because Redis stores sync status"
        explanation: "Redis only caches. The condition on the `Application` holds the reason."
    correct_option: b
    explanation: "Read `status.conditions` first. A `ComparisonError` comes from the repo server and happens before any object is applied."

  - id: ats018-020-03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Map a ComparisonError message to the source field."
    source_readings:
      - sections/section-020/module-03/course-01-where-argo-cd-reports-a-problem.md
    prompt: "`argocd app get scout-path` shows `ComparisonError ... unable to resolve 'mian' to a commit SHA`. Which field of the `Application` is wrong?"
    options:
      - id: a
        text: "`source.path`"
        explanation: "A wrong path gives `app path does not exist`."
      - id: b
        text: "`source.repoURL`"
        explanation: "A wrong repository gives `failed to list refs: repository not found`."
      - id: c
        text: "`destination.namespace`"
        explanation: "The destination is used when applying. This error comes while rendering."
      - id: d
        text: "`source.targetRevision`"
        explanation: "Correct. The revision `mian` is a typo for `main` and cannot be resolved to a commit."
    correct_option: d
    explanation: "The last words of a `ComparisonError` name the source field: path, revision or repository."

  - id: ats018-020-03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Map a repository error to the repoURL field."
    source_readings:
      - sections/section-020/module-03/course-01-where-argo-cd-reports-a-problem.md
    prompt: "The condition on an `Application` reads `failed to list refs: repository not found: Repository not found`. The Secret with the credentials exists and is labelled. What do you check first?"
    options:
      - id: a
        text: "`source.repoURL`, which may name a repository that does not exist"
        explanation: "Correct. `repository not found` points at the repository address. `authentication required` would point at the credentials."
      - id: b
        text: "`source.path`, which may be missing from the repository"
        explanation: "A wrong path gives `app path does not exist`."
      - id: c
        text: "`syncPolicy.automated`, which may be off"
        explanation: "The sync policy does not affect how the repo server clones."
      - id: d
        text: "`progressDeadlineSeconds` of the Deployment"
        explanation: "That setting controls Deployment health, not cloning."
    correct_option: a
    explanation: "The repo server could not find the repository. Check `repoURL` before the files in Git."

  - id: ats018-020-03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read a rejected manifest and decide where to fix it."
    source_readings:
      - sections/section-020/module-03/course-02-sync-failures-waves-and-hooks.md
    prompt: "`scout-reject` is `OutOfSync`. The Service is `Synced`, and the Deployment is `Missing` with `containerPort: Invalid value: 99999: must be between 1 and 65535`. Who produced the message, and where is the fix?"
    options:
      - id: a
        text: "The repo server produced it, so fix the repository credentials"
        explanation: "Rendering worked, because the Service was applied. The repository is reachable."
      - id: b
        text: "The kubelet produced it, so fix the image tag"
        explanation: "The Deployment was refused before any pod existed, so the kubelet was not involved."
      - id: c
        text: "The Kubernetes API server rejected the manifest, and the application controller passed the message on. Fix the port in Git"
        explanation: "Correct. The cause is in the files, so the fix is a commit."
      - id: d
        text: "The Redis cache produced it, so clear the cache"
        explanation: "Redis does not validate manifests."
    correct_option: c
    explanation: "A validation error in the object table comes from the API server. The manifest in Git is wrong, so the fix is a commit."

  - id: ats018-020-03-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Recover from a retry that uses the old commit."
    source_readings:
      - sections/section-020/module-03/course-02-sync-failures-waves-and-hooks.md
    prompt: "You fixed a bad manifest in Git, but the automated sync still retries the old commit. Which command ends the failing operation?"
    options:
      - id: a
        text: "`argocd app diff`"
        explanation: "It shows the difference and does not end an operation."
      - id: b
        text: "`kubectl rollout restart`"
        explanation: "That restarts pods and does not change a sync operation."
      - id: c
        text: "`argocd app get --refresh`"
        explanation: "It compares again but does not end the running operation."
      - id: d
        text: "`argocd app terminate-op`"
        explanation: "Correct. Argo CD 3.5 retries a failed automated sync on the same revision until you terminate it."
    correct_option: d
    explanation: "Check `operationState.operation.sync.revision`. If it is still the old commit, run `argocd app terminate-op`."

  - id: ats018-020-03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say when a PreSync hook runs."
    source_readings:
      - sections/section-020/module-03/course-02-sync-failures-waves-and-hooks.md
    prompt: "A Job carries the annotation `argocd.argoproj.io/hook: PreSync`, and the Job fails. What happens to the rest of the sync?"
    options:
      - id: a
        text: "Argo CD applies the other objects first and runs the Job at the end"
        explanation: "`PostSync` hooks run at the end. `PreSync` runs before anything else."
      - id: b
        text: "The sync stops before any other object is applied"
        explanation: "Correct. A failed `PreSync` Job stops the sync. Read the Job log, fix it in Git and sync again."
      - id: c
        text: "Argo CD ignores the failure, because hooks are not part of the sync"
        explanation: "Hooks run at fixed points of the sync, and a failed `PreSync` hook stops it."
      - id: d
        text: "Argo CD deletes the Job and the Deployment"
        explanation: "A failure does not delete the application objects."
    correct_option: b
    explanation: "`PreSync` hooks run before the normal apply. A failed one stops the sync, so nothing else changes."

  - id: ats018-020-03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Put one object before the others with a sync wave."
    source_readings:
      - sections/section-020/module-03/course-02-sync-failures-waves-and-hooks.md
    prompt: "A ConfigMap must exist before the Deployment that reads it is applied. Neither object has any annotation. What do you add?"
    options:
      - id: a
        text: "`argocd.argoproj.io/sync-wave: 1` on the ConfigMap, as a number"
        explanation: "Annotation values are strings, and a higher wave runs later."
      - id: b
        text: "`argocd.argoproj.io/hook: PostSync` on the ConfigMap"
        explanation: "`PostSync` runs after everything is healthy, so it is too late."
      - id: c
        text: "`argocd.argoproj.io/sync-wave: \"-1\"` on the ConfigMap"
        explanation: "Correct. Objects without the annotation are in wave `0`, and lower waves are applied first. Argo CD waits until the wave is healthy."
      - id: d
        text: "`selfHeal: true` in the sync policy"
        explanation: "Self-heal reverts drift. It does not order a sync."
    correct_option: c
    explanation: "A sync wave is a string annotation. Argo CD applies lower waves first and waits for each wave to be healthy."

  - id: ats018-020-03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recognise a fight between self-heal and an HPA."
    source_readings:
      - sections/section-020/module-03/course-03-permanent-drift-and-ignore-differences.md
    prompt: "The replica count of a Deployment flips between `1` and `2` every few seconds. Git says `replicas: 1`, an HPA has `minReplicas: 2`, and self-heal is on. You own the manifests. What is the cleanest fix?"
    options:
      - id: a
        text: "Remove `replicas` from the Deployment in Git, so Git no longer has an opinion"
        explanation: "Correct. Then only the HPA writes the field. If you cannot change the manifest, use `ignoreDifferences` with `RespectIgnoreDifferences=true`."
      - id: b
        text: "Run `kubectl scale` to two replicas"
        explanation: "Self-heal sets the field back to what Git says."
      - id: c
        text: "Delete the HPA"
        explanation: "That removes the autoscaling the team wants."
      - id: d
        text: "Raise `progressDeadlineSeconds` of the Deployment"
        explanation: "That setting controls Deployment health, not a fight over replicas."
    correct_option: a
    explanation: "Two writers of one field cause a loop. Remove the field from Git, or tell Argo CD to ignore it."

  - id: ats018-020-03-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Use `ignoreDifferences` with `RespectIgnoreDifferences`."
    source_readings:
      - sections/section-020/module-03/course-03-permanent-drift-and-ignore-differences.md
    prompt: "A HorizontalPodAutoscaler changes `spec.replicas`, and self-heal keeps setting it back. You add `ignoreDifferences` for that field, but a sync still overwrites it. What is missing?"
    options:
      - id: a
        text: "The sync option `Prune=true`"
        explanation: "Pruning deletes objects; it does not protect a field."
      - id: b
        text: "A second `Application`"
        explanation: "A second application does not stop the sync from writing the field."
      - id: c
        text: "The sync option `RespectIgnoreDifferences=true`"
        explanation: "Correct. Without it the comparison ignores the field but the sync still writes it."
      - id: d
        text: "A longer `progressDeadlineSeconds`"
        explanation: "That setting controls Deployment health, not drift."
    correct_option: c
    explanation: "`ignoreDifferences` removes a field from the comparison. `RespectIgnoreDifferences=true` also keeps the sync from overwriting it."

  - id: ats018-020-03-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Follow a Degraded message to the pod event."
    source_readings:
      - sections/section-020/module-03/course-04-health-failures.md
    prompt: "`scout-image` is `Synced` and `Degraded` with the message `Deployment \"scout\" exceeded its progress deadline`. What is the next step to find the cause?"
    options:
      - id: a
        text: "Run `argocd app sync scout-image` again"
        explanation: "Git and the cluster already match, so a sync changes nothing."
      - id: b
        text: "Read the pods and their events in the destination namespace, for example `kubectl describe pod`"
        explanation: "Correct. The health message says the rollout failed, not why. The events can show `ImagePullBackOff` and the missing image tag."
      - id: c
        text: "Delete the `Application` and create it again"
        explanation: "That removes the symptom and not the cause."
      - id: d
        text: "Read the repository Secret"
        explanation: "The repository was read well, because the application is `Synced`."
    correct_option: b
    explanation: "The Argo CD health message is a pointer. The cause is in the pod events, and the fix is a commit."
