# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-capstone-020
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - mccutchen/go-httpbin:2.25.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: "Argo CD API server and web page"
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: "Gitea web page and Git over HTTP"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: "Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)"
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed
      description: "Pushes platform-apps and outpost-apps into Git, adds a credential template and creates the broken probe Application"
      type: file
      source: bootstrap/03-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: probe-repaired
      description: The probe Application is fixed in Git, Synced, Healthy, automated with prune and self-heal, and serves requests
      type: file
      source: validation/validate-probe-repaired.sh
    - name: outpost-project
      description: The AppProject outpost allows one repository, one namespace and no cluster-scoped resources
      type: file
      source: validation/validate-project.sh
    - name: environment-applications
      description: One ApplicationSet generated scout-staging and scout-production and both are Synced and Healthy
      type: file
      source: validation/validate-applicationset.sh
    - name: outpost-application
      description: The outpost-scout Application runs in the outpost project and the project rejects another repository
      type: file
      source: validation/validate-outpost.sh

teardown:
  keepCluster: false
