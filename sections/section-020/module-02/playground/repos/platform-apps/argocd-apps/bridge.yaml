apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bridge
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/starfleet/platform-apps.git
    targetRevision: main
    path: apps/bridge
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
