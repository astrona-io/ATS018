# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-020-02-02
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - curlimages/curl:8.22.0
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - mccutchen/go-httpbin:2.25.0
    - nginx:1.29-alpine
    - gitea/gitea:28.1.0-rootless
    - quay.io/argoproj/argocd:v3.5.4
    - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
  - name: argocd
    description: Argo CD API server and web page
    namespace: argocd
    resource: svc/argocd-server
    targetPort: 443
    hostPort: 8080
    scheme: https
  - name: gitea
    description: The Git server (git over HTTP)
    namespace: gitea
    resource: svc/gitea-http
    targetPort: 3000
    hostPort: 3000
    scheme: http
bootstrap:
  manifests:
  - name: lab-start
    type: file
    source: manifests/lab-start.yaml
  init:
  - name: install-gitea
    description: Starts the in-cluster Git server
    type: file
    source: bootstrap/01-install-gitea.sh
  - name: install-argocd
    description: Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)
    type: file
    source: bootstrap/02-install-argocd.sh
  - name: seed
    description: Seed the child Applications and their workloads in Git with read credentials
    type: file
    source: bootstrap/03-seed.sh
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-unfinished-state
    description: Require an explicit rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    description: Apply the reference solution and wait for the live result
    type: file
    source: solution/apply.sh
    timeout: 15m
validation:
  scripts:
  - name: live-result
    description: Deliver three child Applications through a parent; Check each child and its workload independently
    type: file
    source: validation/validate.sh
