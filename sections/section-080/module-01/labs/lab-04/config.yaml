# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-080-01-04
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - curlimages/curl:8.22.0
    - ghcr.io/stefanprodan/podinfo:6.14.0
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - docker.io/istio/pilot:1.30.7
    - docker.io/istio/proxyv2:1.30.7
    - docker.io/prom/prometheus:v3.10.0
    - ghcr.io/prometheus-operator/prometheus-config-reloader:v0.89.0
    - ghcr.io/fluxcd/flagger:1.45.0
    - ghcr.io/fluxcd/flagger-loadtester:0.39.0
bootstrap:
  init:
  - name: install-istio-flagger
    description: Installs Istio 1.30.7, its Prometheus add-on, Flagger 1.45.0 and the load tester
    type: file
    source: bootstrap/01-install-istio-flagger.sh
  - name: initialize
    description: Initialize a healthy ungated baseline
    type: file
    source: bootstrap/02-initialize.sh
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
  - resource: deploy/scout-primary
    namespace: starfleet
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-unfinished-state
    description: Require an explicit rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    description: Apply the reference solution and wait for the live result
    type: file
    source: solution/apply.sh
    timeout: 15m
validation:
  scripts:
  - name: live-result
    description: Hold promotion with a confirm-promotion webhook; Retain waiting evidence and approve the healthy
      candidate
    type: file
    source: validation/validate.sh
