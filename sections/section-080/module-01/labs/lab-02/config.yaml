# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-080-01-02
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/fluxcd/flagger:1.45.0
      - ghcr.io/fluxcd/flagger-loadtester:0.39.0
bootstrap:
  init:
    - name: install-flagger
      description: Installs Flagger and the load tester without a mesh or metrics backend
      type: file
      source: bootstrap/01-install-flagger.sh
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Applies the reference solution
      type: file
      source: solution/apply.sh
validation:
  scripts:
    - name: blue-green-definition
      description: Uses Kubernetes blue/green with iterations and a synchronous HTTP gate
      type: file
      source: validation/validate-blue-green-definition.sh
    - name: gated-release
      description: A failed gate blocked a release and a new environment value reached the primary
      type: file
      source: validation/validate-gated-release.sh
    - name: saved-events
      description: Saved Canary event identities and messages match live events
      type: file
      source: validation/validate-saved-events.sh
teardown:
  keepCluster: false
