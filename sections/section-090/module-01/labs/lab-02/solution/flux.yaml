apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-infra
  namespace: flux-system
spec:
  interval: 1m
  url: http://gitea-http.gitea.svc:3000/starfleet/platform-infra.git
  ref:
    branch: main
  secretRef:
    name: platform-infra-auth

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: platform-infra
  path: ./platform
  prune: true
  wait: true
  timeout: 2m

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: environments
  namespace: flux-system
spec:
  interval: 1m
  dependsOn:
    - name: platform
  sourceRef:
    kind: GitRepository
    name: platform-infra
  path: ./environments
  prune: true
  wait: true
  timeout: 2m
