apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  name: scoutenvironments.platform.starfleet.dev
spec:
  scope: Namespaced
  group: platform.starfleet.dev
  names:
    kind: ScoutEnvironment
    plural: scoutenvironments
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                version:
                  type: string
                  description: The podinfo image tag to run.
                replicas:
                  type: integer
                  default: 1
                message:
                  type: string
                  default: hello
              required:
                - version
