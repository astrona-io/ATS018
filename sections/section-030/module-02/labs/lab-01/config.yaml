# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-030-02
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-flux
      description: Installs the Flux 2.9.6 controllers
      type: file
      source: bootstrap/01-install-flux.sh
    - name: seed-release
      description: Installs the scout release and makes its upgrade fail
      type: file
      source: bootstrap/02-seed-release.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: release-repaired
      description: The same HelmRelease is Ready, the pods are ready and shuttle gets a response from the chart
      type: file
      source: validation/validate-release-repaired.sh
    - name: remediation-configured
      description: Upgrade remediation rolls back, retries and remediates the last failure
      type: file
      source: validation/validate-remediation.sh

teardown:
  keepCluster: false
