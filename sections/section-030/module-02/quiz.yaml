schema_version: 1
kind: question_bank
id: ats018-020-02
course_id: ATS018
exam_code: CNPE
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-030/module-02
  title: Manage Many Applications With ApplicationSets
questions:
  - id: ats018-020-02-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Say why the parent of an app of apps does not show a failing child."
    source_readings:
      - sections/section-030/module-02/course-01-app-of-apps.md
    prompt: "In an app of apps setup, the parent `Application` `platform-apps` is `Synced` and `Healthy`, but the pods of the child `scout` crash. What explains this, and what should you watch?"
    options:
      - id: a
        text: "The parent copies the health of the last child only, so watch the last child"
        explanation: "Argo CD does not copy health from one child."
      - id: b
        text: "The parent checks health once an hour, so wait and look again"
        explanation: "The parent does not wait on a timer. It does not judge its children."
      - id: c
        text: "Argo CD does not judge the health of an `Application` object by default, so watch each child `Application`"
        explanation: "Correct. The parent is `Healthy` even when a child is `Degraded`."
      - id: d
        text: "The repo server hides child errors, so read its logs"
        explanation: "The repo server renders manifests. It does not decide health."
    correct_option: c
    explanation: "The parent only delivers `Application` objects. Their health is not part of the parent health by default, so check the children."

  - id: ats018-020-02-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict what a delete of the parent Application removes."
    source_readings:
      - sections/section-030/module-02/course-01-app-of-apps.md
    prompt: "You delete the parent `Application` `platform-apps` with `kubectl delete -f application-platform-apps.yaml`. It has no `finalizers` field. What happens to the three child applications and their workloads?"
    options:
      - id: a
        text: "They stay, because the parent has no `resources-finalizer.argocd.argoproj.io` finalizer"
        explanation: "Correct. Without the finalizer, a delete removes only that object and leaves what it created."
      - id: b
        text: "They are deleted, because a parent always deletes its children"
        explanation: "A delete cascades only when the finalizer is on the `Application`."
      - id: c
        text: "The children are deleted but the workloads stay"
        explanation: "Without the finalizer, nothing the parent delivered is deleted."
      - id: d
        text: "The delete is refused until the children are deleted"
        explanation: "Kubernetes does not block the delete. There is no such rule."
    correct_option: a
    explanation: "Add `resources-finalizer.argocd.argoproj.io` to `metadata.finalizers` for a cascading delete. Leave it out to stop managing something without removing it."

  - id: ats018-020-02-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the destination namespace of a parent Application."
    source_readings:
      - sections/section-030/module-02/course-01-app-of-apps.md
    prompt: "The parent `Application` delivers a folder of `Application` manifests. The children deploy into the namespace `starfleet`. Which `destination.namespace` does the parent need?"
    options:
      - id: a
        text: "`starfleet`, because that is where the workloads run"
        explanation: "The parent delivers `Application` objects, not workloads."
      - id: b
        text: "`default`, because it is the default namespace"
        explanation: "`Application` objects must be created in the `argocd` namespace."
      - id: c
        text: "`kube-system`, because controllers run there"
        explanation: "Argo CD does not run in that namespace in this setup, and `Application` objects belong in `argocd`."
      - id: d
        text: "`argocd`, because `Application` objects live there"
        explanation: "Correct. The parent delivers `Application` objects, and they must be created in `argocd`."
    correct_option: d
    explanation: "The parent path is the folder with the `Application` manifests, and its destination namespace is `argocd`."

  - id: ats018-020-02-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the `missingkey=error` template option."
    source_readings:
      - sections/section-030/module-02/course-02-applicationsets-and-generators.md
    prompt: "An `ApplicationSet` uses `goTemplate: true` and the placeholder `{{.evn}}` by mistake, while the parameter is named `env`. What does `goTemplateOptions: [\"missingkey=error\"]` change?"
    options:
      - id: a
        text: "It creates the missing parameter `evn` with the value `staging`"
        explanation: "The option does not invent parameters."
      - id: b
        text: "The template fails with an error and the `ApplicationSet` reports it, instead of rendering an empty string"
        explanation: "Correct. Without the option, the placeholder renders as nothing and produces a name such as `scout-`."
      - id: c
        text: "It makes Argo CD ignore the generator and use the default project"
        explanation: "The option affects only template rendering."
      - id: d
        text: "It deletes the `ApplicationSet`"
        explanation: "The option does not delete anything."
    correct_option: b
    explanation: "`missingkey=error` turns a misspelled parameter into a visible error. The `ApplicationSet` conditions show it as `ErrorOccurred`."

  - id: ats018-020-02-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Say who owns a generated Application."
    source_readings:
      - sections/section-030/module-02/course-02-applicationsets-and-generators.md
    prompt: "You edit the generated `Application` `scout-production` by hand and change its `targetRevision`. What does the ApplicationSet controller do?"
    options:
      - id: a
        text: "It keeps your change, because the object is an ordinary `Application`"
        explanation: "The generated `Application` has an owner reference to the `ApplicationSet`."
      - id: b
        text: "It deletes the `Application` and the workloads"
        explanation: "A hand edit does not delete the object."
      - id: c
        text: "It copies your change into the template"
        explanation: "The template is not changed by edits to generated objects."
      - id: d
        text: "It sets the `Application` back to what the template says"
        explanation: "Correct. The owner reference shows that the `ApplicationSet` is in charge. Change the template or the generator instead."
    correct_option: d
    explanation: "The `ApplicationSet` owns the applications it generates. Hand edits are reverted, so change the template."

  - id: ats018-020-02-q06
    type: single_choice
    difficulty: beginner
    learning_objective: "Pick the placeholder that gives a folder name."
    source_readings:
      - sections/section-030/module-02/course-02-applicationsets-and-generators.md
    prompt: "A Git directory generator uses `directories` with `path: apps/*`. For the folder `apps/scout`, which placeholder gives the value `scout` for the `Application` name?"
    options:
      - id: a
        text: "`{{.path.path}}`"
        explanation: "That gives the full folder path, `apps/scout`."
      - id: b
        text: "`{{.env}}`"
        explanation: "`env` exists only in the list generator example, not in a Git directory generator."
      - id: c
        text: "`{{.path.basename}}`"
        explanation: "Correct. It gives the last part of the folder path."
      - id: d
        text: "`{{.name}}`"
        explanation: "The Git directory generator does not provide a `name` parameter."
    correct_option: c
    explanation: "The Git directory generator provides `path.path`, the full folder path, and `path.basename`, the last part."

  - id: ats018-020-02-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain deletion in an `ApplicationSet`."
    source_readings:
      - sections/section-030/module-02/course-02-applicationsets-and-generators.md
    prompt: "A Git directory generator makes one `Application` per folder. A team deletes the folder `outpost-scout` from the repository. What happens by default?"
    options:
      - id: a
        text: "Argo CD deletes the generated `Application` and its workloads"
        explanation: "Correct. Removing a folder removes the generated application unless `preserveResourcesOnDeletion` is set."
      - id: b
        text: "Nothing; generated applications stay until deleted by hand"
        explanation: "An `ApplicationSet` owns what it generates and removes it."
      - id: c
        text: "Only the `Application` is deleted; the workloads stay"
        explanation: "The workloads stay only when `preserveResourcesOnDeletion` is set."
      - id: d
        text: "The `ApplicationSet` fails and stops generating"
        explanation: "The other folders keep generating applications."
    correct_option: a
    explanation: "An `ApplicationSet` owns the applications it generates. Removing an element or a folder deletes the application and its workloads unless `preserveResourcesOnDeletion` is set."

  - id: ats018-020-02-q08
    type: single_choice
    difficulty: beginner
    learning_objective: "Skip the polling wait of the Git generator."
    source_readings:
      - sections/section-030/module-02/course-02-applicationsets-and-generators.md
    prompt: "You push a new folder `apps/beacon` to the repository of a Git directory generator, and no `beacon` `Application` appears for a minute. What is the cause, and what skips the wait?"
    options:
      - id: a
        text: "The folder name is too long, so rename it"
        explanation: "Folder name length is not the cause."
      - id: b
        text: "The `Application` was created in the wrong namespace, so list all namespaces"
        explanation: "Generated applications are created in `argocd`."
      - id: c
        text: "The repo server cache is full, so restart Redis"
        explanation: "Nothing needs a restart. The generator checks Git on a timer."
      - id: d
        text: "The Git generator polls every three minutes by default, so add the annotation `argocd.argoproj.io/application-set-refresh=true` to the `ApplicationSet`"
        explanation: "Correct. The controller removes the annotation again after it refreshed."
    correct_option: d
    explanation: "The Git generator polls on a timer. The refresh annotation makes the controller check the repository now."

  - id: ats018-020-02-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Read the two kinds of AppProject errors."
    source_readings:
      - sections/section-030/module-02/course-03-appprojects-for-a-second-tenant.md
    prompt: "An `Application` in a project has a valid repository and destination, but it contains a `ClusterRole`. The project does not whitelist it. What does Argo CD report?"
    options:
      - id: a
        text: "The whole application is invalid with an `InvalidSpecError` condition"
        explanation: "That happens when the repository or destination is outside the project rules."
      - id: b
        text: "Only that object is blocked, with `resource rbac.authorization.k8s.io:ClusterRole is not permitted in project`"
        explanation: "Correct. A kind that is not whitelisted blocks only that object."
      - id: c
        text: "Argo CD syncs the object because the `default` project allows it"
        explanation: "The application is in a project that does not whitelist it."
      - id: d
        text: "A `ComparisonError` from the repo server"
        explanation: "The repo server renders the object; the project check comes after."
    correct_option: b
    explanation: "A repository or destination outside the rules invalidates the whole application. A kind that is not whitelisted blocks only that object."

  - id: ats018-020-02-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Allow a core kind in an AppProject whitelist."
    source_readings:
      - sections/section-030/module-02/course-03-appprojects-for-a-second-tenant.md
    prompt: "The `outpost` project lists only a Deployment and a Service in `namespaceResourceWhitelist`. A ConfigMap in the repository stays `Missing` with `resource :ConfigMap is not permitted in project outpost`. Which entry allows it?"
    options:
      - id: a
        text: "`group: ''` with `kind: ConfigMap`"
        explanation: "Correct. ConfigMaps are in the core API group, which is the empty string."
      - id: b
        text: "`group: 'apps'` with `kind: ConfigMap`"
        explanation: "`apps` is the group of Deployments. A ConfigMap is not in it."
      - id: c
        text: "`group: 'core'` with `kind: ConfigMap`"
        explanation: "The core group is written as an empty string, not `core`."
      - id: d
        text: "A `clusterResourceWhitelist` entry with `kind: ConfigMap`"
        explanation: "A ConfigMap is a namespaced object, so the namespaced whitelist applies."
    correct_option: a
    explanation: "`namespaceResourceWhitelist` lists namespaced kinds. The core API group, where ConfigMaps, Services and Secrets live, has the empty group `''`."
