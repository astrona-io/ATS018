# The four Applications of this playground. Each one is broken on purpose;
# the fault is the material. Never fix it here.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scout-path
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/starfleet/scout-faults.git
    targetRevision: main
    path: paths
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet-path
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
