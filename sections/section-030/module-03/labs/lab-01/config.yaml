# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-030-03
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - gcr.io/go-containerregistry/crane/debug:v0.22.1
      - registry:3.1.2
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/notification-controller:v1.9.4
      - ghcr.io/fluxcd/image-reflector-controller:v1.2.5
      - ghcr.io/fluxcd/image-automation-controller:v1.2.5
  portForwards:
    - name: gitea
      description: "The Git server (git over HTTP)"
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: "Starts the in-cluster Git server"
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-registry
      description: "Starts the in-cluster registry and copies scout 6.14.0 and 6.15.0 into it"
      type: file
      source: bootstrap/02-install-registry.sh
    - name: install-flux
      description: "Installs Flux 2.9.6 with the image reflector and image automation controllers"
      type: file
      source: bootstrap/03-install-flux.sh
    - name: seed
      description: "Pushes scout-deploy into Git, creates the Git credential Secret and starts the delivery of scout 6.14.0"
      type: file
      source: bootstrap/04-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/scout
      namespace: starfleet

testing:
  init:
    - name: solution
      description: "Reference solution applied by `astrona test`"
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: image-automation-objects
      description: "The ImageRepository, ImagePolicy and ImageUpdateAutomation exist, are Ready and select 6.15.0"
      type: file
      source: validation/validate-image-objects.sh
    - name: tag-delivered-through-git
      description: "The automation committed the tag to Git, Flux applied that commit and shuttle receives 6.15.0"
      type: file
      source: validation/validate-delivered-from-git.sh

teardown:
  keepCluster: false
