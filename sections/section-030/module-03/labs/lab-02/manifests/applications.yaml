apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scout-hpa
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea-http.gitea.svc:3000/starfleet/scout-faults.git
    targetRevision: main
    path: hpa
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet-hpa
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
