apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-030-03-02
  docs:
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      metricsServer: true
    preloadImages:
    - ghcr.io/stefanprodan/podinfo:6.15.0
    - gitea/gitea:28.1.0-rootless
    - quay.io/argoproj/argocd:v3.5.4
    - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
  - name: argocd
    description: Argo CD API server and web page
    namespace: argocd
    resource: svc/argocd-server
    targetPort: 443
    hostPort: 8080
    scheme: https
  - name: gitea
    description: The Git server (git over HTTP)
    namespace: gitea
    resource: svc/gitea-http
    targetPort: 3000
    hostPort: 3000
    scheme: http
bootstrap:
  init:
  - name: install-gitea
    description: Starts the in-cluster Git server
    type: file
    source: bootstrap/01-install-gitea.sh
  - name: install-argocd
    description: Installs Argo CD 3.5.4 (non-HA, without Dex and notifications)
    type: file
    source: bootstrap/02-install-argocd.sh
  - name: seed
    description: Seed one HPA-managed workload and its conflicting Application
    type: file
    source: bootstrap/03-seed.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-unfinished-state
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: outcome
    description: Check the live result and the task constraints
    type: file
    source: validation/validate.sh
