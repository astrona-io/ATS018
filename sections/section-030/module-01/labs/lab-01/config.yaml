# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-030-01
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - gitea/gitea:28.1.0-rootless
      - ghcr.io/fluxcd/source-controller:v1.9.6
      - ghcr.io/fluxcd/kustomize-controller:v1.9.6
      - ghcr.io/fluxcd/helm-controller:v1.6.5
      - ghcr.io/fluxcd/notification-controller:v1.9.4
  portForwards:
    - name: git
      description: The deployment repository (Gitea)
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: Starts Gitea and creates the user platform
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-flux
      description: Installs the Flux 2.9.6 controllers
      type: file
      source: bootstrap/02-install-flux.sh
    - name: seed
      description: Seeds the scout-deploy repository and the read-only Secret
      type: file
      source: bootstrap/03-seed.sh
    - name: flux-start
      description: Creates the broken GitRepository and Kustomization and the rest of the starting Flux objects
      type: file
      source: bootstrap/04-seed-flux-objects.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: flux-objects
      description: The source follows main, platform is applied first, scout depends on it and both are Ready and not suspended
      type: file
      source: validation/validate-flux-objects.sh
    - name: change-delivered-from-git
      description: The staging message changed in Git, Flux applied that exact commit and shuttle receives the new message
      type: file
      source: validation/validate-change-from-git.sh
    - name: resumed-kustomization
      description: No Kustomization in flux-system is suspended, all are Ready, and the drifted workload matches Git again
      type: file
      source: validation/validate-resumed-kustomization.sh

teardown:
  keepCluster: false
