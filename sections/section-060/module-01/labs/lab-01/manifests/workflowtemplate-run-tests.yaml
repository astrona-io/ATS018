apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: run-tests
  namespace: starfleet
spec:
  entrypoint: test
  serviceAccountName: workflow-runner
  arguments:
    parameters:
      - name: revision
        value: main
  templates:
    - name: test
      inputs:
        parameters:
          - name: revision
        artifacts:
          - name: source
            path: /src
            git:
              repo: http://gitea-http.gitea.svc:3000/starfleet/scout-app.git
              revision: "{{inputs.parameters.revision}}"
      container:
        image: alpine:3.23
        workingDir: /wrong
        command: [sh, test.sh]
