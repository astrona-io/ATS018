# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-060-01-04
  docs:
    question: question.md
    solution: solution.md
    prerequisites: prerequisites.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
    - curlimages/curl:8.22.0
    - alpine:3.23
    - quay.io/argoproj/workflow-controller:v4.1.6
    - quay.io/argoproj/argoexec:v4.1.6
    - quay.io/argoproj/argocli:v4.1.6
  portForwards:
  - name: argo-workflows
    description: Argo Workflows web UI
    namespace: starfleet
    resource: svc/argo-server
    targetPort: 2746
    hostPort: 2746
    scheme: http
tabs:
- name: argo-workflows
  title: Argo Workflows
  type: browser
  portForward: argo-workflows
bootstrap:
  manifests:
  - name: lab-start
    type: file
    source: manifests/lab-start.yaml
  init:
  - name: install-argo-cli
    description: Installs the argo command-line tool v4.1.6 in ~/.astrona/bin unless argo is already on the PATH
    type: file
    source: bootstrap/00-install-argo-cli.sh
  - name: install-argo-workflows
    description: Installs Argo Workflows v4.1.6 into starfleet, with the web UI on port 2746
    type: file
    source: bootstrap/01-install-argo-workflows.sh
  waitFor:
  - resource: deploy/shuttle
    namespace: starfleet
testing:
  init:
  - name: verify-unfinished-state
    description: Require an explicit rejection before solving
    type: file
    source: testing/verify-start.sh
    timeout: 10m
  - name: solution
    description: Apply the reference solution and wait for the live result
    type: file
    source: solution/apply.sh
    timeout: 15m
validation:
  scripts:
  - name: workflow-template
    description: WorkflowTemplate deploy-workload declares image, name, namespace and msg, runs as deployment-writer and fills the Deployment from them and waits for an available replica
    type: file
    source: validation/validate-template.sh
  - name: workflow-runs
    description: A Succeeded run from the current template with the requested inputs
    type: file
    source: validation/validate-runs.sh
  - name: deployment-logs
    description: The run created scout in outpost with alpine:3.23, and its container log prints the msg value
    type: file
    source: validation/validate-deployments.sh
teardown:
  keepCluster: false
