schema_version: 1
kind: question_bank
id: ats018-section-060-quiz
course_id: ATS018
exam_code: CNPE
status: draft
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: section
  id: section-060
  title: "Infrastructure Deployment Through GitOps (Crossplane)"
questions:
  - id: ats018-060-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Tell a Provider from a Function."
    source_readings:
      - sections/section-060/module-01/course-01-providers-and-functions.md
    prompt: "What does a Crossplane `Function` add?"
    options:
      - id: a
        text: "The logic that a `Composition` calls"
        explanation: "Correct. A `Provider` adds the kinds for one system, and a `Function` adds logic."
      - id: b
        text: "The kinds for one outside system"
        explanation: "That is a `Provider`."
      - id: c
        text: "A new API such as `ScoutEnvironment`"
        explanation: "A `CompositeResourceDefinition` defines a kind."
      - id: d
        text: "Permission to read Git"
        explanation: "A Function adds no Git access."
    correct_option: a
    explanation: "Both must be `INSTALLED` and `HEALTHY` before anything depends on them."
  - id: ats018-060-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell an XRD from a Composition."
    source_readings:
      - sections/section-060/module-01/course-02-define-an-api-with-an-xrd-and-a-composition.md
    prompt: "A platform team wants a small `ScoutEnvironment` kind that other teams can create. Which two objects do they write?"
    options:
      - id: a
        text: "A `Provider` and a `Function`"
        explanation: "They install packages; they do not define a kind."
      - id: b
        text: "A `CompositeResourceDefinition` for the kind and a `Composition` that maps it to real objects"
        explanation: "Correct. The XRD defines the kind and the Composition creates the objects behind it."
      - id: c
        text: "An `ApplicationSet` and an `AppProject`"
        explanation: "Those are Argo CD objects."
      - id: d
        text: "A `Rollout` and an `AnalysisTemplate`"
        explanation: "Those are Argo Rollouts objects."
    correct_option: b
    explanation: "In `Pipeline` mode the `Composition` calls functions such as `function-patch-and-transform`."
  - id: ats018-060-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read Synced and Ready."
    source_readings:
      - sections/section-060/module-01/course-02-define-an-api-with-an-xrd-and-a-composition.md
    prompt: "A composed `Object` is `Synced` and `Ready`, but its pods do not run. What is the likely reason?"
    options:
      - id: a
        text: "`Synced` means the pods run"
        explanation: "`Synced` means the object could be applied."
      - id: b
        text: "The Provider is not installed"
        explanation: "Then the `Object` would not be `Synced`."
      - id: c
        text: "By default an `Object` is Ready as soon as it exists; a readiness rule that reads the observed Deployment is missing"
        explanation: "Correct. A readiness rule makes `Ready` mean that the pods run."
      - id: d
        text: "Crossplane cannot read Deployments"
        explanation: "A readiness rule can read the observed Deployment."
    correct_option: c
    explanation: "`Synced` says that the object could be applied. `Ready` says that it works."
  - id: ats018-060-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Order definition and instance in Argo CD and Flux."
    source_readings:
      - sections/section-060/module-01/course-03-deliver-the-platform-with-argo-cd.md
      - sections/section-060/module-01/course-05-deliver-the-platform-with-flux.md
    prompt: "The XRD must exist before the XRs that use it. How does Flux make that order?"
    options:
      - id: a
        text: "With sync waves"
        explanation: "Sync waves are an Argo CD feature."
      - id: b
        text: "With `ImagePolicy`"
        explanation: "That chooses image tags."
      - id: c
        text: "With `selfHeal`"
        explanation: "That reverts manual changes in Argo CD."
      - id: d
        text: "With `dependsOn` between two `Kustomization` objects"
        explanation: "Correct. Argo CD uses sync waves and `SkipDryRunOnMissingResource=true`."
    correct_option: d
    explanation: "A definition must exist before its instances. Argo CD orders with sync waves and Flux with `dependsOn`."
  - id: ats018-060-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Add a health check for a custom kind in Argo CD."
    source_readings:
      - sections/section-060/module-01/course-03-deliver-the-platform-with-argo-cd.md
    prompt: "A `ScoutEnvironment` is not Ready, but its Argo CD application shows `Healthy`. Why?"
    options:
      - id: a
        text: "Argo CD has no built-in health check for a custom kind, so a Lua health check that reads the `Ready` condition is needed"
        explanation: "Correct. Without it the application stays `Healthy`."
      - id: b
        text: "Crossplane hides the condition from Argo CD"
        explanation: "The condition is in the object; Argo CD has no check that reads it."
      - id: c
        text: "The application is `Synced`, which always means `Healthy`"
        explanation: "Sync status and health status are separate."
      - id: d
        text: "Argo CD reads only Deployments"
        explanation: "Argo CD has checks for built-in kinds and accepts Lua checks for others."
    correct_option: a
    explanation: "Argo CD cannot judge a custom kind until a health check reads its `Ready` condition."
  - id: ats018-060-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read Flux health for a custom kind."
    source_readings:
      - sections/section-060/module-01/course-05-deliver-the-platform-with-flux.md
    prompt: "A Flux `Kustomization` with `wait: true` applies an XR that is not Ready. What does Flux report?"
    options:
      - id: a
        text: "`Ready`, because applying worked"
        explanation: "With `wait: true`, readiness includes the health of the applied objects."
      - id: b
        text: "`HealthCheckFailed`, with the name of the unready object"
        explanation: "Correct. Flux reads the `Ready` condition itself."
      - id: c
        text: "`Suspended`"
        explanation: "Nothing suspends the Kustomization."
      - id: d
        text: "Nothing, because Flux cannot read custom kinds"
        explanation: "Flux reads the `Ready` condition of the object."
    correct_option: b
    explanation: "Flux reads the `Ready` condition itself when `wait: true` is set."
  - id: ats018-060-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Diagnose a not-Ready XR layer by layer."
    source_readings:
      - sections/section-060/module-01/course-04-diagnose-a-composite-resource-that-is-not-ready.md
    prompt: "A production XR asks for an image tag that does not exist and is not Ready. Where do you make the fix?"
    options:
      - id: a
        text: "In the composed `Deployment`, with `kubectl edit`"
        explanation: "Crossplane reverts a manual edit of a composed object."
      - id: b
        text: "In the `Provider` package"
        explanation: "The provider is healthy; the request in the XR is wrong."
      - id: c
        text: "In the XR in Git; Crossplane and the GitOps controller revert manual edits"
        explanation: "Correct. Go down the layers to find the cause, then fix it in Git."
      - id: d
        text: "In the XRD, by deleting the kind"
        explanation: "Deleting the kind removes every XR of it."
    correct_option: c
    explanation: "Go from the XR condition to the `Object` conditions to the pods and events. The fix belongs in the XR in Git."
