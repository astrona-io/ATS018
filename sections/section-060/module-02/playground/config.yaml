# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-060-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
bootstrap:
  init:
    - name: tofu-cli
      description: Installs OpenTofu 1.13.2 in the terminal
      type: file
      source: bootstrap/00-install-tofu.sh
    - name: seed-state
      description: Downloads Kubernetes provider 3.4.0 and seeds real local state
      type: file
      source: bootstrap/01-seed-state.sh
teardown:
  keepCluster: false
