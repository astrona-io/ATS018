# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-060-02
  docs:
    question: question.md
    solution: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
bootstrap:
  init:
    - name: tofu-cli
      description: Installs OpenTofu 1.13.2 in the terminal
      type: file
      source: bootstrap/00-install-tofu.sh
    - name: seed-state
      description: Downloads Kubernetes provider 3.4.0 and seeds real local state
      type: file
      source: bootstrap/01-seed-state.sh
testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      type: file
      source: solution/apply.sh
validation:
  scripts:
    - name: scout
      description: Reviewed plan, local state, live resources and request agree
      type: file
      source: validation/validate-scout.sh
teardown:
  keepCluster: false
