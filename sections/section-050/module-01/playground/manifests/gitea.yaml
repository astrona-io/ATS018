# Plumbing: a small in-cluster Git server (Gitea, built-in SQLite database,
# no cache cluster). The lessons only use it as "the Git repository".
apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
  labels:
    app: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:28.1.0-rootless
          ports:
            - name: http
              containerPort: 3000
          env:
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__server__ROOT_URL, value: "http://gitea-http.gitea.svc:3000/" }
            - { name: GITEA__server__OFFLINE_MODE, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__webhook__ALLOWED_HOST_LIST, value: "*" }
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea }
            - { name: config, mountPath: /etc/gitea }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: config, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-http
  namespace: gitea
spec:
  selector:
    app: gitea
  ports:
    - name: http
      port: 3000
      targetPort: http
