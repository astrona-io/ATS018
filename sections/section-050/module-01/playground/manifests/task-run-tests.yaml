apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
  namespace: starfleet
spec:
  params:
    - name: version
      type: string
      default: 6.15.0
  workspaces:
    - name: source
  results:
    - name: version
      description: The tested application version
  steps:
    - name: test
      image: alpine:3.23
      workingDir: /workspace/wrong
      env:
        - name: SCOUT_VERSION
          value: $(params.version)
      script: |
        #!/bin/sh
        set -eu
        sh test.sh
        printf '%s' "$SCOUT_VERSION" > "$(results.version.path)"
