# Starting state: scout as a canary Rollout on podinfo 6.14.0, and an
# AnalysisTemplate the learner must finish. The template requests the wrong
# Service and has no jsonPath or successCondition, on purpose. The fault is
# the material: never fix it here.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: scout-canary-message
  namespace: starfleet
spec:
  metrics:
    - name: message
      initialDelay: 15s
      count: 3
      interval: 10s
      provider:
        web:
          url: http://scout.starfleet/
          timeoutSeconds: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.14.0
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  strategy:
    canary:
      canaryService: scout-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 20
        - pause: {}
        - setWeight: 60
        - pause: {}
