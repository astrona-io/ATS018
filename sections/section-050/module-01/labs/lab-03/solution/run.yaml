apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: scout-resolvers-
  namespace: starfleet
spec:
  pipelineRef:
    name: scout-ci
  workspaces:
  - name: shared
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
