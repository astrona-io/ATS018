# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-050-01
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - quay.io/argoproj/argo-rollouts:v1.10.0

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-argo-rollouts
      description: Installs the Argo Rollouts 1.10.0 controller
      type: file
      source: bootstrap/01-install-argo-rollouts.sh
    - name: install-release-recorder
      description: Installs a watcher that records the canary steps each release passes
      type: file
      source: bootstrap/02-install-release-recorder.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/scout
      namespace: starfleet

testing:
  init:
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: rollout-strategy
      description: scout is a Rollout with canary steps that pause at 20 percent, and the Deployment is gone
      type: file
      source: validation/validate-rollout-strategy.sh
    - name: release-served
      description: A second revision passed through the canary steps, is Healthy and stable, and shuttle receives 6.15.0
      type: file
      source: validation/validate-release-served.sh

teardown:
  keepCluster: false
