# The first Task of the release pipeline: clone a Git repository into the
# `source` workspace and report the commit ID and the content of VERSION.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-source
  namespace: starfleet
spec:
  params:
    - name: url
      type: string
    - name: revision
      type: string
      default: main
  workspaces:
    - name: source
  results:
    - name: commit
      description: The commit ID that was cloned
    - name: version
      description: The content of the VERSION file
  steps:
    - name: clone
      image: alpine/git:2.52.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        git clone --quiet "$(params.url)" .
        git checkout --quiet "$(params.revision)"
        printf '%s' "$(git rev-parse HEAD)" > "$(results.commit.path)"
        printf '%s' "$(cat VERSION)" > "$(results.version.path)"
        echo "Cloned $(params.url) at $(git rev-parse --short HEAD), VERSION $(cat VERSION)"
