id: ats018-section-050-quiz
course_id: ATS018
exam_code: CNPE
status: draft
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: section
  id: section-050
  title: "Progressive Delivery"
questions:
  - id: ats018-050-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know how a Rollout starts."
    source_readings:
      - sections/section-050/module-01/course-01-convert-a-deployment.md
    prompt: "You create a `Rollout` with a canary strategy for the first time. What do the canary steps do?"
    options:
      - id: a
        text: "They are skipped; the controller establishes the stable ReplicaSet"
        explanation: "Correct. The initial Rollout does not stop at the canary steps."
      - id: b
        text: "They run at once and pause at the first `pause`"
        explanation: "Steps start only when the pod template changes."
      - id: c
        text: "They run only after you promote"
        explanation: "There is no release to promote on the first creation."
      - id: d
        text: "The Rollout fails until a second template exists"
        explanation: "The first template becomes the stable one."
    correct_option: a
    explanation: "The initial Rollout establishes its stable template. A later template change starts the canary steps."
  - id: ats018-050-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Compute a replica split without a traffic router."
    source_readings:
      - sections/section-050/module-01/course-02-canary-steps-and-weights.md
    prompt: "A Rollout with five replicas and no traffic router reaches `setWeight: 20`. What does the controller run?"
    options:
      - id: a
        text: "Five new pods and five stable pods"
        explanation: "The total stays at five."
      - id: b
        text: "One new pod and four stable pods"
        explanation: "Correct. Without a router, the controller approximates the weight with whole replica counts."
      - id: c
        text: "One new pod and one stable pod"
        explanation: "The stable ReplicaSet keeps four pods."
      - id: d
        text: "Five stable pods and one new pod receiving exactly 20% of requests"
        explanation: "Replica counts approximate the weight. A short sample need not match."
    correct_option: b
    explanation: "Five replicas give one new and four stable pods at 20%, and three new and two stable at 60%."
  - id: ats018-050-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Tell abort from retry."
    source_readings:
      - sections/section-050/module-01/course-04-abort-and-retry.md
    prompt: "A canary with a broken image was aborted. The Rollout reports `Degraded`. What does the abort not do?"
    options:
      - id: a
        text: "Keep the stable version serving"
        explanation: "The abort does exactly that."
      - id: b
        text: "Scale the canary down"
        explanation: "The abort does that."
      - id: c
        text: "Correct the desired pod template"
        explanation: "Correct. The abort keeps the stable pods serving and scales the canary down. The broken template stays."
      - id: d
        text: "Report `Degraded`"
        explanation: "The abort does report `Degraded`."
    correct_option: c
    explanation: "A new template starts a new release. `retry` allows another attempt at the same aborted template."
  - id: ats018-050-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know that a passing analysis can still pause."
    source_readings:
      - sections/section-050/module-02/course-03-pre-promotion-analysis.md
    prompt: "A blue/green Rollout has `autoPromotionEnabled: false`. The pre-promotion AnalysisRun is `Successful`. What happens?"
    options:
      - id: a
        text: "The active Service switches at once"
        explanation: "Automatic promotion is off."
      - id: b
        text: "The release aborts"
        explanation: "A successful analysis does not abort."
      - id: c
        text: "The analysis runs again"
        explanation: "It finished."
      - id: d
        text: "The Rollout still pauses until someone promotes"
        explanation: "Correct. A passing pre-promotion analysis does not promote on its own when automatic promotion is off."
    correct_option: d
    explanation: "A `Successful` result still leaves an operator pause when automatic promotion is disabled."
  - id: ats018-050-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Read what a failed pre-promotion analysis leaves serving."
    source_readings:
      - sections/section-050/module-02/course-04-abort-on-failed-analysis.md
    prompt: "The pre-promotion analysis of a blue/green release fails. Which Service selector does the active Service keep?"
    options:
      - id: a
        text: "The selector of the stable pod template"
        explanation: "Correct. Users keep getting successful responses while the Rollout reports `Degraded`."
      - id: b
        text: "The selector of the candidate pod template"
        explanation: "The switch happens only on promotion."
      - id: c
        text: "No selector, so the Service has no endpoints"
        explanation: "The stable pods keep serving."
      - id: d
        text: "The preview selector, because it is newer"
        explanation: "The preview Service selects the candidate and the active Service does not change."
    correct_option: a
    explanation: "Failed pre-promotion analysis retains the stable active selector. Abort does not repair the desired template."
  - id: ats018-050-q06
    type: single_choice
    difficulty: advanced
    learning_objective: "Guard an analysis against missing data."
    source_readings:
      - sections/section-050/module-02/course-02-promote-and-measure-the-candidate.md
    prompt: "A Prometheus query returns no samples and the condition is guarded. What is the result?"
    options:
      - id: a
        text: "The measurement passes, because no errors were counted"
        explanation: "No data is not a pass."
      - id: b
        text: "The measurement fails, because an empty result must never stand in for a passing application"
        explanation: "Correct. The guarded condition fails on an empty result."
      - id: c
        text: "The AnalysisRun waits forever"
        explanation: "An empty result fails the guarded condition."
      - id: d
        text: "The measurement is skipped"
        explanation: "It is recorded as a failed measurement."
    correct_option: b
    explanation: "An empty result fails the guarded condition. A value that is not a number satisfies neither comparison and gives `Inconclusive`, not `Successful`."
  - id: ats018-050-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name what Flagger creates."
    source_readings:
      - sections/section-050/module-03/course-01-what-flagger-creates.md
    prompt: "You apply a `Canary` that targets the Deployment `scout`. Which objects does Flagger create?"
    options:
      - id: a
        text: "An `AnalysisTemplate` and a `Rollout`"
        explanation: "Those belong to Argo Rollouts."
      - id: b
        text: "A `Gateway` and an `HTTPRoute`"
        explanation: "Those belong to the Gateway API setup of the Rollouts plugin."
      - id: c
        text: "A primary Deployment, canary pods, a primary and a canary Service, two `DestinationRule` objects and a `VirtualService`"
        explanation: "Correct. During a release it changes only the weights in the `VirtualService`."
      - id: d
        text: "A second `Canary` for the primary"
        explanation: "Flagger creates no second `Canary`."
    correct_option: c
    explanation: "Flagger keeps the Deployment and creates a primary copy. Argo Rollouts replaces the Deployment with a `Rollout`."
  - id: ats018-050-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Read a Flagger failure."
    source_readings:
      - sections/section-050/module-03/course-03-roll-back-a-failing-canary.md
    prompt: "The failed checks of a `Canary` reach `threshold`. What does Flagger do?"
    options:
      - id: a
        text: "Rolls the canary forward to 100%"
        explanation: "That happens only when all steps pass."
      - id: b
        text: "Repairs the Deployment template"
        explanation: "Flagger does not repair the Deployment. The fix is a new pod template."
      - id: c
        text: "Deletes the `Canary` object"
        explanation: "The object stays with the status `Failed`."
      - id: d
        text: "Sets the canary weight to 0, scales the canary down and marks the `Canary` as `Failed`"
        explanation: "Correct. The primary pods keep serving the last good version."
    correct_option: d
    explanation: "A failed check is counted. At the threshold, the weight goes to 0 and the status is `Failed`."
  - id: ats018-050-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Split traffic with a Gateway API router."
    source_readings:
      - sections/section-050/module-04/course-01-split-traffic-with-the-gateway-api-plugin.md
    prompt: "With the Gateway API plugin, `setWeight: 10` is set and three pods run. What decides how many requests reach the canary?"
    options:
      - id: a
        text: "The router: the weight is a share of requests, and the pod count only gives capacity"
        explanation: "Correct. A short sample can differ, so count at least 100 requests."
      - id: b
        text: "The pod count: one of three pods gets about a third of requests"
        explanation: "With a router the weight is a share of requests, not of pods."
      - id: c
        text: "The `Service` selector order"
        explanation: "A selector does not set weights."
      - id: d
        text: "The `analysis` block"
        explanation: "The analysis checks metrics; it does not set the split."
    correct_option: a
    explanation: "With a router, `setWeight` is a share of requests. A weight of 10% sent about 11 of 100 requests to the canary."
