# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-050-04
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      gatewayAPI: envoy
      gatewayPorts:
        http: 28080
        https: 28443
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - quay.io/argoproj/argo-rollouts:v1.10.0
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9

bootstrap:
  init:
    - name: install-argo-rollouts
      description: Installs the Argo Rollouts 1.10.0 controller and the Gateway API plugin v0.17.0
      type: file
      source: bootstrap/01-install-argo-rollouts.sh
    - name: install-prometheus
      description: Installs a trimmed kube-prometheus-stack 92.3.0 in monitoring
      type: file
      source: bootstrap/02-install-prometheus.sh
    - name: start-scout
      description: Creates the scout Rollout without steps, its Services, the Gateway, the HTTPRoute and the PodMonitor
      type: file
      source: bootstrap/03-start-scout.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: rollout-definition
      description: The Rollout has a managed header route, the setCanaryScale and setHeaderRoute steps, and a background analysis with the latest hash
      type: file
      source: validation/validate-rollout-definition.sh
    - name: release-behaviour
      description: One AnalysisRun passed a good canary, one failed a faulty canary, the managed route is gone and the gateway serves the good template
      type: file
      source: validation/validate-release-behaviour.sh

teardown:
  keepCluster: false
