# scout as an Argo Rollout with a canary strategy that uses the Gateway API
# traffic router plugin, and no steps yet. `scout` is the stable Service and
# `scout-canary` the canary Service. The HTTPRoute `scout-route` sends all
# traffic to the stable Service until a release changes the weights.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.14.0
          command: ["./podinfo", "--port=9898", "--port-metrics=9797"]
          env:
            - name: PODINFO_UI_MESSAGE
              value: stable
          ports:
            - name: http
              containerPort: 9898
            - name: metrics
              containerPort: 9797
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  strategy:
    canary:
      stableService: scout
      canaryService: scout-canary
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            httpRoute: scout-route
            namespace: starfleet
---
apiVersion: v1
kind: Service
metadata:
  name: scout
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: scout-canary
  namespace: starfleet
  labels:
    app: scout
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: scout-gateway
  namespace: starfleet
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scout-route
  namespace: starfleet
spec:
  parentRefs:
    - name: scout-gateway
  rules:
    - backendRefs:
        - name: scout
          port: 80
          weight: 100
        - name: scout-canary
          port: 80
          weight: 0
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: scout
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: scout
  podTargetLabels:
    - rollouts-pod-template-hash
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
