# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Shift Canary Traffic With Argo Rollouts And A Traffic Router (PLAYGROUND) —
# playground environment. Argo Rollouts 1.10.0 with the Gateway API plugin
# v0.17.0, the Gateway API CRDs and Envoy Gateway from astrona's `gatewayAPI`
# addon (plumbing), a trimmed kube-prometheus-stack 92.3.0, and `scout` as a
# canary Rollout with a Gateway, an HTTPRoute and no steps. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-050-04
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    addons:
      gatewayAPI: envoy
      gatewayPorts:
        http: 28080
        https: 28443
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - quay.io/argoproj/argo-rollouts:v1.10.0
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
  portForwards:
    - name: prometheus
      description: "The Prometheus web page and HTTP API"
      namespace: monitoring
      resource: svc/kps-prometheus
      targetPort: 9090
      hostPort: 9090
      scheme: http

bootstrap:
  init:
    - name: install-argo-rollouts
      description: "Installs the Argo Rollouts 1.10.0 controller and the Gateway API plugin v0.17.0"
      type: file
      source: bootstrap/01-install-argo-rollouts.sh
    - name: install-prometheus
      description: "Installs a trimmed kube-prometheus-stack 92.3.0 in monitoring"
      type: file
      source: bootstrap/02-install-prometheus.sh
    - name: start-scout
      description: "Creates the scout Rollout, its Services, the Gateway, the HTTPRoute and the PodMonitor"
      type: file
      source: bootstrap/03-start-scout.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
