schema_version: 1
kind: question_bank
id: ats018-050-03
course_id: ATS018
exam_code: CNPE
status: alpha
provenance: "Original practice material written for this course; not official exam questions."
scope:
  type: module
  id: section-050/module-03
  title: "Automate Canary Analysis With Flagger"
questions:
  - id: ats018-050-03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the objects Flagger creates for a Canary."
    source_readings:
      - sections/section-050/module-03/course-01-what-flagger-creates.md
    prompt: "You apply a `Canary` for the Deployment `scout` and wait until it is `Initialized`. Which objects did the Flagger controller create?"
    options:
      - id: a
        text: "A `scout-primary` Deployment, the Services `scout-primary` and `scout-canary`, two Istio `DestinationRule` objects and a `VirtualService`"
        explanation: "Correct. Flagger builds these objects so it can split requests between the primary and the canary pods."
      - id: b
        text: "Only a second Deployment named `scout-canary`"
        explanation: "The canary Deployment is not the only object. Flagger also builds the primary Deployment, Services and Istio objects."
      - id: c
        text: "A Rollout object that replaces the Deployment"
        explanation: "A Rollout belongs to Argo Rollouts. Flagger works with the Deployment and Istio objects."
      - id: d
        text: "An `AnalysisTemplate` and an `AnalysisRun`"
        explanation: "Those belong to Argo Rollouts. Flagger keeps its checks in the `analysis` block of the `Canary`."
    correct_option: a
    explanation: "Flagger copies the pod template into `scout-primary`, scales `scout` to zero and routes all requests to the primary pods."

  - id: ats018-050-03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know which Deployment you edit."
    source_readings:
      - sections/section-050/module-03/course-01-what-flagger-creates.md
    prompt: "A `Canary` is `Initialized`. The `scout` Deployment shows `0/0` pods. You want to release a new image. What do you do?"
    options:
      - id: a
        text: "Edit the pod template of `scout-primary`"
        explanation: "Flagger owns `scout-primary` and overwrites your change."
      - id: b
        text: "Scale `scout` back to one replica first"
        explanation: "`0/0` is correct between releases. Scaling it does not start a release."
      - id: c
        text: "Edit the pod template of the `scout` Deployment"
        explanation: "Correct. A change to the pod template of the target Deployment starts a release."
      - id: d
        text: "Edit the `VirtualService` weights"
        explanation: "Flagger edits the weights during a release. Your edit is overwritten."
    correct_option: c
    explanation: "Edit the target Deployment only. Flagger copies the template into the primary after a successful release."

  - id: ats018-050-03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Know what starts a Flagger release."
    source_readings:
      - sections/section-050/module-03/course-02-analysis-and-a-promoted-canary.md
    prompt: "Which change starts a Flagger release for `scout`?"
    options:
      - id: a
        text: "Raising the `replicas` of the Deployment from 1 to 3"
        explanation: "A change that does not touch the pod template does not start a release."
      - id: b
        text: "Changing the container image of the Deployment"
        explanation: "Correct. A new pod template makes Flagger start the canary pods."
      - id: c
        text: "Running `kubectl get canary scout`"
        explanation: "Reading an object changes nothing."
      - id: d
        text: "Restarting the Flagger controller"
        explanation: "A restart does not change the target Deployment."
    correct_option: b
    explanation: "An image, an environment variable or another template field starts a release."

  - id: ats018-050-03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the analysis fields."
    source_readings:
      - sections/section-050/module-03/course-02-analysis-and-a-promoted-canary.md
    prompt: "A `Canary` has `interval: 15s`, `stepWeight: 10`, `maxWeight: 50` and `threshold: 3`. What does `threshold: 3` mean?"
    options:
      - id: a
        text: "Flagger raises the weight three times"
        explanation: "The number of steps comes from `stepWeight` and `maxWeight`."
      - id: b
        text: "Flagger waits three intervals before the first step"
        explanation: "`threshold` does not set a delay."
      - id: c
        text: "Flagger accepts up to three failed checks before it rolls back"
        explanation: "Correct. After the third failed check the status becomes `Failed`."
      - id: d
        text: "Flagger keeps three canary pods"
        explanation: "`threshold` does not set a pod count."
    correct_option: c
    explanation: "`threshold` counts failed checks. `maxWeight` is the highest canary weight before promotion."

  - id: ats018-050-03-q05
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain a Halt advancement event."
    source_readings:
      - sections/section-050/module-03/course-02-analysis-and-a-promoted-canary.md
    prompt: "The events of a good release show a warning `Halt advancement` because the metric returned no values. What does it show?"
    options:
      - id: a
        text: "Flagger promoted the canary without a check"
        explanation: "It did not promote. It waited."
      - id: b
        text: "The canary failed and Flagger rolled it back"
        explanation: "A rollback needs failed checks that reach `threshold`. Here the metric had no values yet."
      - id: c
        text: "The Canary object is invalid"
        explanation: "An invalid object does not start steps."
      - id: d
        text: "Flagger waits and does not promote when it has no data, and it continues once requests reach the metrics"
        explanation: "Correct. Without requests the success rate has no values, so a load test webhook must send traffic."
    correct_option: d
    explanation: "The `rollout` webhook calls the load tester so the metric has data at every step."

  - id: ats018-050-03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the outcome of a failing canary."
    source_readings:
      - sections/section-050/module-03/course-03-roll-back-a-failing-canary.md
    prompt: "A canary with `--random-error` fails three checks with a success rate of 88.04 percent. What does Flagger do?"
    options:
      - id: a
        text: "It sets the canary weight to 0, scales the canary pods down and marks the `Canary` as `Failed`"
        explanation: "Correct. The primary pods keep serving the last good version."
      - id: b
        text: "It promotes the canary anyway"
        explanation: "A success rate below the 99 percent minimum blocks promotion."
      - id: c
        text: "It repairs the pod template of `scout`"
        explanation: "Flagger does not repair the template. The faulty command stays in `scout`."
      - id: d
        text: "It deletes the `Canary` object"
        explanation: "It does not delete the object."
    correct_option: a
    explanation: "Only 10 percent of the requests ever reached the bad pods, and the rollback moved them back to the primary."

  - id: ats018-050-03-q07
    type: single_choice
    difficulty: advanced
    learning_objective: "Pick the right fix after a rollback."
    source_readings:
      - sections/section-050/module-03/course-03-roll-back-a-failing-canary.md
    prompt: "The `Canary` is `Failed`. The `scout` Deployment still has the faulty command. How do you get a good release?"
    options:
      - id: a
        text: "Lower `threshold` so the check passes"
        explanation: "Do not weaken the check to hide a fault."
      - id: b
        text: "Wait, because Flagger removes the command after the rollback"
        explanation: "Flagger does not edit the template."
      - id: c
        text: "Delete `scout-primary`"
        explanation: "That removes the version that serves users."
      - id: d
        text: "Remove the faulty command from the `scout` template, so Flagger starts a new release"
        explanation: "Correct. A new template starts a new release, and in a GitOps environment you make the change in Git."
    correct_option: d
    explanation: "A fault the metric measures is a fault of the version. Fix the version."

  - id: ats018-050-03-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Know what the built-in metric cannot see."
    source_readings:
      - sections/section-050/module-03/course-03-roll-back-a-failing-canary.md
    prompt: "The built-in `request-success-rate` of Flagger passes for an application that returns status 200 with a wrong body. Why?"
    options:
      - id: a
        text: "The metric counts HTTP status codes only"
        explanation: "Correct. A wrong body with status 200 counts as a success."
      - id: b
        text: "The metric reads the response body"
        explanation: "It does not read bodies."
      - id: c
        text: "Flagger skips the metric at weight 10"
        explanation: "It runs at every step."
      - id: d
        text: "Istio hides the status codes from Prometheus"
        explanation: "Istio exposes the status codes, and the metric uses them."
    correct_option: a
    explanation: "Choose or add a check that measures the fault you care about."
