# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-050-03
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - docker.io/istio/pilot:1.30.7
      - docker.io/istio/proxyv2:1.30.7
      - docker.io/prom/prometheus:v3.10.0
      - ghcr.io/prometheus-operator/prometheus-config-reloader:v0.89.0
      - ghcr.io/fluxcd/flagger:1.45.0
      - ghcr.io/fluxcd/flagger-loadtester:0.39.0

bootstrap:
  init:
    - name: install-istio-flagger
      description: Installs Istio 1.30.7, its Prometheus add-on, Flagger 1.45.0 and the load tester
      type: file
      source: bootstrap/01-install-istio-flagger.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/scout
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: canary-definition
      description: The Canary targets scout with the Istio provider, a 99 percent success-rate check and a load-test webhook
      type: file
      source: validation/validate-canary-definition.sh
    - name: release-history
      description: One release rolled back on failed checks, a fixed release was promoted, and shuttle receives the fixed template
      type: file
      source: validation/validate-release-history.sh

teardown:
  keepCluster: false
