apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: scout
  namespace: starfleet
spec:
  provider: kubernetes
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scout
  progressDeadlineSeconds: 120
  service:
    port: 80
    targetPort: http
  analysis:
    interval: 15s
    threshold: 2
    iterations: 3
    metrics: []
    webhooks:
      - name: scout-http-check
        type: pre-rollout
        url: http://flagger-loadtester.starfleet/
        timeout: 5s
        metadata:
          type: bash
          cmd: "curl -fsS --max-time 3 http://scout-canary.starfleet/"
