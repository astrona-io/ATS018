# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Gate A Blue/Green Release With Analysis (PLAYGROUND) — playground environment.
# Argo Rollouts 1.10.0, a trimmed kube-prometheus-stack 92.3.0 (Prometheus
# Operator and one Prometheus) scraping every scout pod, and `scout` as a
# Rollout with a blueGreen strategy and no analysis. `shuttle` sends steady
# traffic to the active and the preview Service. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-018-playground-050-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - quay.io/argoproj/argo-rollouts:v1.10.0
      - quay.io/prometheus-operator/prometheus-operator:v0.94.1
      - quay.io/prometheus-operator/prometheus-config-reloader:v0.94.1
      - quay.io/prometheus/prometheus:v3.15.0-distroless
      - ghcr.io/jkroepke/kube-webhook-certgen:1.8.9
  portForwards:
    - name: prometheus
      description: "The Prometheus web page and HTTP API"
      namespace: monitoring
      resource: svc/kps-prometheus
      targetPort: 9090
      hostPort: 9090
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-argo-rollouts
      description: "Installs the Argo Rollouts 1.10.0 controller"
      type: file
      source: bootstrap/01-install-argo-rollouts.sh
    - name: install-prometheus
      description: "Installs a trimmed kube-prometheus-stack 92.3.0 in monitoring"
      type: file
      source: bootstrap/02-install-prometheus.sh
    - name: start-scout
      description: "Creates the scout Rollout, its Services and its PodMonitor"
      type: file
      source: bootstrap/03-start-scout.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet

teardown:
  keepCluster: false
