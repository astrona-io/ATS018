# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
apiVersion: astrona.io/v1
metadata:
  name: ats-018-lab-050-02
  docs:
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - curlimages/curl:8.22.0
      - alpine:3.23
      - alpine/git:2.52.0
      - gcr.io/go-containerregistry/crane/debug:v0.22.1
      - registry:3.1.2
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
  portForwards:
    - name: argocd
      description: Argo CD API server and web page
      namespace: argocd
      resource: svc/argocd-server
      targetPort: 443
      hostPort: 8080
      scheme: https
    - name: gitea
      description: The Git server (Gitea)
      namespace: gitea
      resource: svc/gitea-http
      targetPort: 3000
      hostPort: 3000
      scheme: http

bootstrap:
  manifests:
    - name: lab-start
      type: file
      source: manifests/lab-start.yaml
  init:
    - name: install-gitea
      description: Starts the in-cluster Git server
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-registry
      description: Starts the in-cluster registry and copies the podinfo base images into it
      type: file
      source: bootstrap/02-install-registry.sh
    - name: install-argocd
      description: Installs Argo CD 3.5.4
      type: file
      source: bootstrap/03-install-argocd.sh
    - name: install-tekton
      description: Installs Tekton Pipelines 1.17.0
      type: file
      source: bootstrap/04-install-tekton.sh
    - name: seed
      description: Pushes both repositories into Git, creates the Argo CD Application and installs the Tasks
      type: file
      source: bootstrap/05-seed.sh
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/scout
      namespace: starfleet

testing:
  init:
    - name: verify-unfinished-state
      description: Require a ready API and an explicit grader rejection before solving
      type: file
      source: testing/verify-start.sh
      timeout: 10m
    - name: solution
      description: Reference solution applied by `astrona test`
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: release-pipeline
      description: The Pipeline chains clone, publish and commit, and a PipelineRun with the scout-ci service account Succeeded
      type: file
      source: validation/validate-release-pipeline.sh
    - name: image-and-commit
      description: The registry has scout:6.15.0 and Git has a tekton commit that sets newTag 6.15.0
      type: file
      source: validation/validate-image-and-commit.sh
    - name: version-served
      description: Argo CD is Synced to that commit with automated sync still on, and shuttle gets version 6.15.0
      type: file
      source: validation/validate-version-served.sh

teardown:
  keepCluster: false
